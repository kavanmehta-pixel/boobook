argin-bottom:14px}\n.road-items{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:16px}\n.road-item{font:400 12px/1.5 var(--sans);color:var(--muted);font-weight:300;padding-left:14px;position:relative}\n.road-item::before{content:'';position:absolute;left:0;top:8px;width:6px;height:1px;background:var(--muted)}\n.road-phase.done .road-item{color:var(--sig);opacity:.65}\n.road-phase.done .road-item::before{background:var(--sig)}\n\n/* ═══ VC GATES ═══ */\n.gates-flex{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:48px}\n.gate{padding:18px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;text-align:left;cursor:pointer;transition:all .15s}\n.gate:hover{border-color:var(--line2)}\n.gate.on{border-color:var(--sigb);background:var(--sigbg)}\n.gate.done{border-color:var(--sigb);background:rgba(0,229,196,.04)}\n.gate-n{font:500 9px/1 var(--mono);color:var(--muted);letter-spacing:1.5px;margin-bottom:8px}\n.gate.done .gate-n,.gate.on .gate-n{color:var(--sig)}\n.gate-name{font:500 13px/1.25 var(--serif);color:var(--head);margin-bottom:10px;letter-spacing:-.01em}\n.gate-status{font:600 8px/1 var(--mono);padding:3px 7px;border-radius:2px;letter-spacing:1px;display:inline-block;text-transform:uppercase}\n.gs-done{background:rgba(0,229,196,.1);color:var(--sig);border:1px solid var(--sigb)}\n.gs-now{background:rgba(245,158,11,.08);color:var(--amb);border:1px solid rgba(245,158,11,.2)}\n.gs-next{background:rgba(255,255,255,.03);color:var(--muted);border:1px solid var(--line)}\n.gate-detail{margin-top:24px;padding:32px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;min-height:240px}\n.gd-title{font:500 26px/1.2 var(--serif);color:var(--head);margin-bottom:24px;display:flex;align-items:center;gap:14px}\n.gd-cols{display:grid;grid-template-columns:1fr 1fr;gap:48px}\n.gd-col-l{font:500 10px/1 var(--mono);letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:14px}\n.gd-req{font:400 14px/1.6 var(--sans);color:var(--body);padding:8px 0;border-bottom:1px solid var(--line);font-weight:300;display:flex;gap:10px}\n.gd-req::before{content:'→';color:var(--sig);flex-shrink:0}\n.gd-req:last-child{border-bottom:none}\n\n/* ═══ FUNDING ═══ */\n.fund-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;margin-top:48px}\n.fund-card{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:32px}\n.fund-card h3{font-size:22px;margin-bottom:8px}\n.fund-card .body-s{margin-bottom:24px;max-width:none}\n.fund-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:300}\n.fund-row:last-child{border-bottom:none}\n.fund-row .fl{color:var(--muted)}\n.fund-row .fv{font-family:var(--mono);color:var(--body);font-weight:400}\n.fund-row .fv.g{color:var(--sig)}\n.fund-row .fv.w{color:var(--amb)}\n.fund-row.total{border-top:1px solid var(--line2);margin-top:8px;padding-top:14px;border-bottom:none}\n.fund-row.total .fl{font-weight:500;color:var(--head)}\n.fund-row.total .fv{font-size:16px;font-weight:500;color:var(--sig)}\n.caution{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.12);border-radius:4px;padding:18px;margin-top:18px}\n.caution-l{font:500 10px/1 var(--mono);letter-spacing:2px;color:var(--amb);margin-bottom:12px;text-transform:uppercase}\n.caution-item{font:400 13px/1.65 var(--sans);color:var(--body);padding:6px 0;font-weight:300;display:flex;gap:10px}\n.caution-item::before{content:'!';color:var(--amb);font-weight:700;flex-shrink:0;font-family:var(--mono)}\n\n/* ═══ RESEARCH ═══ */\n.refs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:48px}\n.refs h4{font:500 11px/1 var(--mono);color:var(--sig);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}\n.ref{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font:400 13px/1.55 var(--sans);font-weight:300}\n.ref:last-child{border-bottom:none}\n.ref-n{font:500 11px/1.5 var(--mono);color:var(--sig);flex-shrink:0;min-width:24px}\n.ref-t{color:var(--body)}\n.ref-t a{color:var(--sig);text-decoration:none;border-bottom:1px solid var(--sigb)}\n.ref-t a:hover{color:var(--head)}\n\n/* ═══ FOUNDER / ASK ═══ */\n.ask-spread{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;margin-top:64px;align-items:start}\n.founder{display:flex;gap:32px;align-items:flex-start}\n.founder-mark{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--raised),var(--srf));border:2px solid var(--sigb);flex-shrink:0;display:flex;align-items:center;justify-content:center;font:500 26px/1 var(--serif);color:var(--sig)}\n.founder-name{font:500 26px/1.2 var(--serif);color:var(--head);margin-bottom:6px}\n.founder-role{font:500 11px/1 var(--mono);color:var(--sig);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}\n.ask-list{margin-top:24px;display:flex;flex-direction:column;border-top:1px solid var(--line)}\n.ask-row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}\n.ask-label{font:500 16px/1.4 var(--serif);color:var(--head)}\n.ask-val{font:500 13px/1 var(--mono);color:var(--sig);letter-spacing:1px;text-transform:uppercase}\n.contact-cta{margin-top:48px;padding:32px;background:var(--sigbg);border:1px solid var(--sigb);border-radius:6px;text-align:center}\n.contact-cta-t{font:500 italic 28px/1.3 var(--serif);color:var(--head);letter-spacing:-.01em}\n\n/* ═══ REACH OUT ═══ */\n.reach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.reach-card{display:block;padding:28px 24px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;transition:all .2s;text-decoration:none}\n.reach-card:hover{border-color:var(--sigb);background:var(--sigbg);transform:translateY(-2px)}\n.reach-l{font:500 10px/1 var(--mono);letter-spacing:2px;color:var(--sig);text-transform:uppercase;margin-bottom:12px}\n.reach-v{font:500 17px/1.4 var(--serif);color:var(--head);letter-spacing:-.01em;word-break:break-all}\n\n/* ═══ FOOTER ═══ */\nfooter{padding:48px clamp(24px,5vw,80px);background:var(--ink);border-top:1px solid var(--line);\n  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:24px}\n.f-mark{font:600 13px/1 var(--mono);letter-spacing:5px;color:var(--head)}\n.f-disc{font:400 11px/1.55 var(--sans);color:var(--muted);max-width:580px;font-weight:300}\n.f-links{display:flex;gap:18px}\n.f-links a{font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}\n.f-links a:hover{color:var(--sig)}\n\n/* ═══ RESPONSIVE ═══ */\n@media(max-width:1024px){\n  .spread,.spread-wide{grid-template-columns:1fr;gap:48px}\n  .market-grid,.diff-list,.refs-grid,.road-phases{grid-template-columns:1fr 1fr}\n  .gates-flex{grid-template-columns:repeat(4,1fr)}\n  .ask-spread{grid-template-columns:1fr}\n  .fund-grid{grid-template-columns:1fr}\n  .hero-meta{grid-template-columns:1fr 1fr;gap:24px}\n  .n-links{display:none}\n  .layer{grid-template-columns:1fr;gap:16px}\n}\n@media(max-width:640px){\n  section{padding:80px 24px}\n  .market-grid,.diff-list,.refs-grid,.road-phases,.gates-flex,.comp-table{grid-template-columns:1fr;display:block}\n  .comp-table th,.comp-table td{display:block;padding:8px 0}\n  .gd-cols{grid-template-columns:1fr;gap:24px}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<!-- NAV -->\n<nav>\n  <div class=\"n-mark\"><div class=\"n-pulse\"><\u002Fdiv><span class=\"n-logo\">BOOBOOK<\u002Fspan><\u002Fdiv>\n  <div class=\"n-links\">\n    <a href=\"#problem\">Problem<\u002Fa>\n    <a href=\"#tech\">Technology<\u002Fa>\n    <a href=\"#demo\">Demo<\u002Fa>\n    <a href=\"#market\">Market<\u002Fa>\n    <a href=\"#solution\">Solution<\u002Fa>\n    <a href=\"#compete\">Competitive<\u002Fa>\n    <a href=\"#roadmap\">Roadmap<\u002Fa>\n    <a href=\"#gates\">Gates<\u002Fa>\n    <a href=\"#ask\">Ask<\u002Fa>\n    <a href=\"#research\">Research<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"n-right\">\n    <a href=\"dashboard.html\" class=\"n-btn ghost\">Dashboard<\u002Fa>\n    <a href=\"mailto:kavan.mehta@attaliscapital.com\" class=\"n-btn solid\">Contact<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- HERO -->\n<section id=\"hero\">\n  <div class=\"hero-bg\">\n    <div id=\"hero-map\"><\u002Fdiv>\n    <div class=\"hero-vignette\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-content\">\n    <div class=\"hero-kicker r\">Sovereign Australian Maritime Intelligence<\u002Fdiv>\n    <h1 class=\"r\" style=\"max-width:1100px\">Australia's northern approaches are watched.<br><em style=\"color:var(--sig);font-style:italic\">By allies.<\u002Fem><\u002Fh1>\n    <p class=\"body-l r\" style=\"margin-top:32px;max-width:720px\">Boobook is a passive RF intelligence layer for vessels that turn off their AIS — built on Australian soil, by Australians, for Australian enforcement.<\u002Fp>\n    <div class=\"hero-meta r\">\n      <div class=\"hm-i\"><div class=\"hm-v\">34,498<\u002Fdiv><div class=\"hm-l\">Real AMSA CTS rows processed across the Torres Strait<\u002Fdiv><\u002Fdiv>\n      <div class=\"hm-i\"><div class=\"hm-v\">1,480<\u002Fdiv><div class=\"hm-l\">Anomaly alerts generated on official Australian vessel data<\u002Fdiv><\u002Fdiv>\n      <div class=\"hm-i\"><div class=\"hm-v\">$98.8M<\u002Fdiv><div class=\"hm-l\">US Navy Indo-Pacific RF intelligence contract — competitor<\u002Fdiv><\u002Fdiv>\n      <div class=\"hm-i\"><div class=\"hm-v\">0<\u002Fdiv><div class=\"hm-l\">Australian ground-based passive RF providers in the category<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-scroll\">Scroll<span><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- 01 — PROBLEM -->\n<section id=\"problem\">\n  <div class=\"section-num\">01 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">The Problem<\u002Fdiv>\n    <div class=\"spread-wide\">\n      <div class=\"r\">\n        <h2>The ocean is full of ships that <em>don't want to be seen.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"r\">\n        <p class=\"body-l\">AIS — the Automatic Identification System — is the global standard for vessel tracking. It is also entirely cooperative. A vessel broadcasts its identity, position, course and speed because the rules say it should. The rules do not enforce themselves.<\u002Fp>\n        <p class=\"body-l\" style=\"margin-top:24px\">In Australia's northern approaches — the Torres Strait, Arafura Sea, the Timor and Coral Seas — illegal fishing, sanctions evasion, and unregulated transit happen daily. AFMA's Operation Pristis 2026 ran Kimberley to Cape York hunting the vessels that exploit exactly this gap.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fail-list r\">\n      <div class=\"fail\">\n        <div class=\"fail-num\">i<\u002Fdiv>\n        <div>\n          <div class=\"fail-t\">Switch it off<\u002Fdiv>\n          <div class=\"fail-b\">Disable the transponder. No signal, no track. A vessel running dark can fish protected zones, transfer contraband, or evade enforcement entirely.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fail\">\n        <div class=\"fail-num\">ii<\u002Fdiv>\n        <div>\n          <div class=\"fail-t\">Spoof the signal<\u002Fdiv>\n          <div class=\"fail-b\">Broadcast a false identity or fabricated position. AIS-only systems trust the broadcast. Without independent verification, the spoofed track is the only track.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fail\">\n        <div class=\"fail-num\">iii<\u002Fdiv>\n        <div>\n          <div class=\"fail-t\">Fly below the threshold<\u002Fdiv>\n          <div class=\"fail-b\">Vessels under 300 GT need not carry AIS at all. Thousands of small fishing vessels operate in Australian waters with zero electronic footprint by design.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"big-stat r\">\n      <div class=\"big-stat-v\">8.1M km²<\u002Fdiv>\n      <div class=\"big-stat-l\">Australian EEZ. Satellites revisit every few hours. Patrol vessels cover a fraction at any time. The chokepoints — where every vessel must transit — are watched by no one persistently.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 — TECHNOLOGY -->\n<section id=\"tech\" class=\"alt\">\n  <div class=\"section-num\">02 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">The Technology<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">Four layers. <em>One intelligence product.<\u002Fem><\u002Fh2>\n    <p class=\"body-l r\">Ships that turn off their AIS still emit. VHF radio. Marine radar. Satellite phones. Our ground-based receivers capture these emissions and correlate them against AIS to surface dark-vessel intelligence.<\u002Fp>\n    <div class=\"layer-list r\">\n      <div class=\"layer\">\n        <div class=\"layer-meta\"><div class=\"layer-num\">i<\u002Fdiv><div class=\"layer-label\">Layer 01 — Passive Receive<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"layer-title\">SDR nodes at the chokepoints<\u002Fdiv><div class=\"layer-body\">Software-defined radios passively receive VHF, AIS, and radar emissions from vessels within roughly 40 kilometres. No transmitting. No active spectrum use. No licensing complications. RTL-SDR v4 plus a collinear VHF antenna at sites where every vessel must transit.<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"layer-tags\"><span class=\"tag\">RTL-SDR v4<\u002Fspan><span class=\"tag\">GNU Radio<\u002Fspan><span class=\"tag\">VHF collinear<\u002Fspan><span class=\"tag\">No active emissions<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"layer core\">\n        <div class=\"layer-meta\"><div class=\"layer-num\">ii<\u002Fdiv><div class=\"layer-label c\">Layer 02 — Core technology<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"layer-title\">TDOA geolocation<\u002Fdiv><div class=\"layer-body\">The same emission arrives at three nodes at slightly different times. GCC-PHAT cross-correlation measures those delays to nanosecond precision. Three hyperbolas intersect at the emitter's position. CEP₅₀ of 1–5 km at cluster scale — accurate enough to cue an asset, persistent enough to matter.<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"layer-tags\"><span class=\"tag\">GCC-PHAT<\u002Fspan><span class=\"tag\">GPSDO 1 PPS<\u002Fspan><span class=\"tag\">Hyperbolic solver<\u002Fspan><span class=\"tag\">CEP₅₀ 1–5 km<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"layer\">\n        <div class=\"layer-meta\"><div class=\"layer-num\">iii<\u002Fdiv><div class=\"layer-label\">Layer 03 — Fusion<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"layer-title\">AIS &amp; VMS correlation<\u002Fdiv><div class=\"layer-body\">RF position fixes are compared against AIS and VMS tracks in real time. If RF detects an emitter where AIS shows nothing, it becomes a dark-vessel detection opportunity. AMSA CTS, NOAA AIS, and Global Fishing Watch event streams feed a single normalised schema.<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"layer-tags\"><span class=\"tag\">AMSA CTS<\u002Fspan><span class=\"tag\">NOAA AIS<\u002Fspan><span class=\"tag\">GFW events<\u002Fspan><span class=\"tag\">VMS gates<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"layer\">\n        <div class=\"layer-meta\"><div class=\"layer-num\">iv<\u002Fdiv><div class=\"layer-label\">Layer 04 — Intelligence<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"layer-title\">Anomaly engine &amp; cueing<\u002Fdiv><div class=\"layer-body\">Five detection rules run continuously — AIS gaps, impossible speed (spoofing), loitering, rendezvous, sensitive zone presence. Each alert carries a 0–100 risk score, a full evidence chain, and a recommended enforcement action. Validated on 34,498 real AMSA CTS rows.<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"layer-tags\"><span class=\"tag\">5 detection rules<\u002Fspan><span class=\"tag\">Bayesian scoring<\u002Fspan><span class=\"tag\">Evidence chains<\u002Fspan><span class=\"tag\">60 tests passing<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 — DEMO -->\n<section id=\"demo\" style=\"padding-bottom:0\">\n  <div class=\"section-num\">03 / 11<\u002Fdiv>\n  <div class=\"wrap\" style=\"padding:0 0 64px\">\n    <div class=\"eyebrow r\" style=\"padding:0 clamp(24px,5vw,80px)\">Live Scenario<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px;padding:0 clamp(24px,5vw,80px)\">A vessel goes dark. <em>Watch what happens.<\u002Fem><\u002Fh2>\n    <p class=\"body-l r\" style=\"padding:0 clamp(24px,5vw,80px)\">This scenario runs on real AMSA CTS vessel traffic. Every alert, every track, every coordinate comes from official Australian maritime records. Auto-plays when this section comes into view.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"demo-wrap\">\n    <div id=\"sc-viewport\">\n      <div id=\"sc-map\"><\u002Fdiv>\n\n      <!-- Stepper overlaid on top of the map -->\n      <div class=\"sc-top\" id=\"sc-top\">\n        <div class=\"sc-stepper-hint\"><span class=\"sc-stepper-hint-dot\"><\u002Fspan>Click any stage — or use Next<\u002Fdiv>\n        <div class=\"sc-stepper\" id=\"sc-stepper\"><\u002Fdiv>\n        <div class=\"sc-mode\" id=\"sc-mode\">\n          <button class=\"sc-mb on\" id=\"sc-mb-step\" onclick=\"setMode('step')\">Step<\u002Fbutton>\n          <button class=\"sc-mb\" id=\"sc-mb-auto\" onclick=\"setMode('auto')\">Auto-play<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Bottom: narration + nav -->\n      <div class=\"sc-bottom\" id=\"sc-bottom\">\n        <div class=\"sc-card\">\n          <div class=\"sc-card-narr\" id=\"sc-narr\"><\u002Fdiv>\n          <div class=\"sc-nav\">\n            <button class=\"sc-nav-btn\" id=\"sc-prev\" onclick=\"prevStep()\">← Previous<\u002Fbutton>\n            <div class=\"sc-nav-step\" id=\"sc-nav-step\">Step 1 of 5<\u002Fdiv>\n            <button class=\"sc-nav-btn sc-nav-primary\" id=\"sc-next\" onclick=\"nextStep()\">Next →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Play overlay -->\n      <div class=\"sc-play-overlay\" id=\"sc-play\" onclick=\"startScenario()\">\n        <div class=\"sc-play-btn\">\n          <div class=\"sc-play-circle\"><div class=\"sc-play-tri\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"sc-play-label\" id=\"sc-play-label\">Begin Scenario<\u002Fdiv>\n          <div class=\"sc-play-sub\">5 steps \u00b7 Click through or auto-play<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Right: analytical breakdown -->\n    <div class=\"sc-breakdown\" id=\"sc-breakdown\">\n      <div class=\"scb-bar\">\n        <div class=\"scb-l\">Analytical Breakdown<\u002Fdiv>\n        <div class=\"scb-step\" id=\"scb-step\">Step 01 · Normal transit<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"scb-body\">\n        <div class=\"scb-metrics\" id=\"scb-metrics\"><\u002Fdiv>\n        <div class=\"scb-analysis\"><div class=\"scb-analysis-l\">What the system concludes<\u002Fdiv><div class=\"scb-analysis-b\" id=\"scb-analysis\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrap\" style=\"padding:32px clamp(24px,5vw,80px) 0\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:20px 24px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;flex-wrap:wrap;gap:16px\">\n      <div style=\"font:400 13px/1.5 var(--sans);color:var(--muted);font-weight:300\">Full operational dashboard: <b style=\"color:var(--head);font-weight:500\">34,498 real AMSA CTS rows · 1,480 alerts · 3 months · 5 detection rules<\u002Fb><\u002Fdiv>\n      <a href=\"dashboard.html\" class=\"n-btn solid\">Launch Dashboard →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 — MARKET -->\n<section id=\"market\" class=\"alt\">\n  <div class=\"section-num\">04 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">The Market<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">A real category. <em>A sovereign gap.<\u002Fem><\u002Fh2>\n    <p class=\"body-l r\">The market leaders are American and French. Australia currently buys this intelligence offshore. The sovereign argument is not a talking point — it is a procurement requirement and a national security one.<\u002Fp>\n    <div class=\"market-grid r\">\n      <div class=\"market-tier focus\">\n        <div class=\"mt-label\">SAM — We address this<\u002Fdiv>\n        <div class=\"mt-v\">$8–15M<\u002Fdiv>\n        <div class=\"mt-name\">Australian sovereign MDA<\u002Fdiv>\n        <div class=\"mt-desc\">AFMA, ABF, state fisheries, port security, marine insurers. Persistent ground-based RF + AIS intelligence as a recurring annual contract.<\u002Fdiv>\n        <div class=\"mt-items\">\n          <div class=\"mt-item\">AFMA analytics &amp; monitoring — $2–4M / yr<\u002Fdiv>\n          <div class=\"mt-item\">ABF Maritime Border Command — $3–6M / yr<\u002Fdiv>\n          <div class=\"mt-item\">State agencies &amp; ports — $2–5M / yr<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"market-tier\">\n        <div class=\"mt-label\">TAM — With traction<\u002Fdiv>\n        <div class=\"mt-v\">$120–250M<\u002Fdiv>\n        <div class=\"mt-name\">Indo-Pacific MDA<\u002Fdiv>\n        <div class=\"mt-desc\">Australia, New Zealand, Pacific Island states, Five Eyes adjacent maritime monitoring contracts.<\u002Fdiv>\n        <div class=\"mt-items\">\n          <div class=\"mt-item\">HawkEye 360 — $98.8M single US Navy IDIQ<\u002Fdiv>\n          <div class=\"mt-item\">Unseenlabs Series B — €28M (2023)<\u002Fdiv>\n          <div class=\"mt-item\">Windward Series C — $35M<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"market-tier\">\n        <div class=\"mt-label\">TOM — Don't pitch this<\u002Fdiv>\n        <div class=\"mt-v\" style=\"color:var(--muted)\">$2–4B<\u002Fdiv>\n        <div class=\"mt-name\">Global MDA<\u002Fdiv>\n        <div class=\"mt-desc\">Includes satellite RF and AIS analytics globally. We do not address this. Citing it loses credibility with technical investors.<\u002Fdiv>\n        <div class=\"mt-items\">\n          <div class=\"mt-item\">Spire Maritime — $100M+ ARR<\u002Fdiv>\n          <div class=\"mt-item\">Orbcomm, exactEarth, Pole Star<\u002Fdiv>\n          <div class=\"mt-item\">Not our market<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 — SOLUTION -->\n<section id=\"solution\">\n  <div class=\"section-num\">05 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">The Solution<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">We don't beat satellites on breadth. <em>We beat them on persistence.<\u002Fem><\u002Fh2>\n    <p class=\"body-l r\">Satellites give the world a snapshot every few hours. Boobook gives Australia continuous coverage of the channels that matter. The two are complementary — and we are the only ground layer that exists.<\u002Fp>\n    <div class=\"pull-quote r\">\n      <div class=\"pq-text\">Ground persistence over the channels Australia owns — that is something no satellite can deliver, and what every Australian customer needs.<\u002Fdiv>\n      <div class=\"pq-attr\">— Boobook thesis<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"diff-list r\">\n      <div class=\"diff\">\n        <div class=\"diff-num\">i<\u002Fdiv>\n        <div class=\"diff-t\">Persistent, not periodic<\u002Fdiv>\n        <div class=\"diff-b\">Continuous coverage at the chokepoints. Detection-to-cue latency under thirty seconds instead of hours for satellite revisit.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"diff\">\n        <div class=\"diff-num\">ii<\u002Fdiv>\n        <div class=\"diff-t\">Sovereign, not allied<\u002Fdiv>\n        <div class=\"diff-b\">Australian infrastructure, Australian data, PROTECTED-capable architecture. No ITAR. No foreign data sovereignty issues.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"diff\">\n        <div class=\"diff-num\">iii<\u002Fdiv>\n        <div class=\"diff-t\">Independent verification<\u002Fdiv>\n        <div class=\"diff-b\">RF detection of dark vessels where AIS shows nothing. The independent signal that turns AIS analytics into validated enforcement intelligence.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 — COMPETITIVE -->\n<section id=\"compete\" class=\"alt\">\n  <div class=\"section-num\">06 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">Competitive Landscape<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">The category is real. <em>The Australian slot is empty.<\u002Fem><\u002Fh2>\n    <p class=\"body-l r\">HawkEye 360 validated the entire RF intelligence category with a single $98.8M US Navy IDIQ. Unseenlabs raised €28M Series B on satellite RF fingerprinting. Both are foreign. Neither runs persistently over Australian chokepoints.<\u002Fp>\n    <table class=\"comp-table r\">\n      <thead>\n        <tr><th>Vendor<\u002Fth><th>Coverage Model<\u002Fth><th>Latency<\u002Fth><th>Sovereign AU<\u002Fth><th>Strength<\u002Fth><th>Our position<\u002Fth><\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr>\n          <td><div class=\"comp-name\">HawkEye 360<\u002Fdiv><div class=\"comp-sub\">Virginia, USA<\u002Fdiv><\u002Ftd>\n          <td>Satellite RF — global, periodic<\u002Ftd>\n          <td>15–45 min<\u002Ftd>\n          <td style=\"color:var(--red)\">No · ITAR<\u002Ftd>\n          <td>Open-ocean breadth<\u002Ftd>\n          <td>Fusion partner offshore<\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><div class=\"comp-name\">Unseenlabs<\u002Fdiv><div class=\"comp-sub\">Paris, France<\u002Fdiv><\u002Ftd>\n          <td>Satellite RF — global, periodic<\u002Ftd>\n          <td>Hours<\u002Ftd>\n          <td style=\"color:var(--red)\">No · France<\u002Ftd>\n          <td>EM fingerprinting<\u002Ftd>\n          <td>Fingerprint library<\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><div class=\"comp-name\">Windward<\u002Fdiv><div class=\"comp-sub\">Tel Aviv, Israel<\u002Fdiv><\u002Ftd>\n          <td>AIS analytics<\u002Ftd>\n          <td>Real-time AIS<\u002Ftd>\n          <td style=\"color:var(--red)\">No · Israel<\u002Ftd>\n          <td>AI anomaly detection<\u002Ftd>\n          <td>Software layer reference<\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><div class=\"comp-name\">Spire Maritime<\u002Fdiv><div class=\"comp-sub\">San Francisco<\u002Fdiv><\u002Ftd>\n          <td>Satellite AIS<\u002Ftd>\n          <td>Real-time AIS<\u002Ftd>\n          <td style=\"color:var(--red)\">No · USA<\u002Ftd>\n          <td>Global AIS feed<\u002Ftd>\n          <td>Cooperative-AIS only<\u002Ftd>\n        <\u002Ftr>\n        <tr class=\"row-us\">\n          <td><div class=\"comp-name us\">BOOBOOK<\u002Fdiv><div class=\"comp-sub\" style=\"color:var(--sig)\">Sydney, Australia<\u002Fdiv><\u002Ftd>\n          <td>Ground RF — continuous at choke points<\u002Ftd>\n          <td>&lt; 30 sec<\u002Ftd>\n          <td>Yes · PROTECTED-capable<\u002Ftd>\n          <td>Persistent passage watch<\u002Ftd>\n          <td>Sovereign layer inshore<\u002Ftd>\n        <\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 07 — ROADMAP -->\n<section id=\"roadmap\">\n  <div class=\"section-num\">07 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">Roadmap<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">Staged validation. <em>No bluff.<\u002Fem><\u002Fh2>\n    <p class=\"body-l r\">Every milestone is a proof point that expands what we can credibly claim. We do not skip steps. We do not market what we have not validated.<\u002Fp>\n    <div class=\"roadmap r\">\n      <div class=\"road-line\"><\u002Fdiv>\n      <div class=\"road-phases\">\n        <div class=\"road-phase done\">\n          <div class=\"road-dot\"><\u002Fdiv>\n          <div class=\"road-time\">Complete<\u002Fdiv>\n          <div class=\"road-t\">Prove the signal<\u002Fdiv>\n          <div class=\"road-items\">\n            <div class=\"road-item\">AIS anomaly engine<\u002Fdiv>\n            <div class=\"road-item\">AMSA CTS pipeline<\u002Fdiv>\n            <div class=\"road-item\">Real data — 34,498 rows<\u002Fdiv>\n            <div class=\"road-item\">TDOA simulation validated<\u002Fdiv>\n            <div class=\"road-item\">60 tests passing<\u002Fdiv>\n            <div class=\"road-item\">Investor dashboard live<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"road-phase now\">\n          <div class=\"road-dot\"><\u002Fdiv>\n          <div class=\"road-time\">0–20 weeks<\u002Fdiv>\n          <div class=\"road-t\">Validate hardware<\u002Fdiv>\n          <div class=\"road-items\">\n            <div class=\"road-item\">RF / signals co-founder<\u002Fdiv>\n            <div class=\"road-item\">Live AIS via RTL-SDR<\u002Fdiv>\n            <div class=\"road-item\">3-node TDOA field test<\u002Fdiv>\n            <div class=\"road-item\">Measured error budget<\u002Fdiv>\n            <div class=\"road-item\">10× customer discovery<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"road-phase\">\n          <div class=\"road-dot\"><\u002Fdiv>\n          <div class=\"road-time\">6–14 months<\u002Fdiv>\n          <div class=\"road-t\">First paid pilot<\u002Fdiv>\n          <div class=\"road-items\">\n            <div class=\"road-item\">AFMA / ABF contract signed<\u002Fdiv>\n            <div class=\"road-item\">Torres Strait deployment<\u002Fdiv>\n            <div class=\"road-item\">$50–150k ARR<\u002Fdiv>\n            <div class=\"road-item\">RDTI first claim<\u002Fdiv>\n            <div class=\"road-item\">ASCA EOI submitted<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"road-phase\">\n          <div class=\"road-dot\"><\u002Fdiv>\n          <div class=\"road-time\">14–24 months<\u002Fdiv>\n          <div class=\"road-t\">VC-approachable<\u002Fdiv>\n          <div class=\"road-items\">\n            <div class=\"road-item\">$250k+ ARR<\u002Fdiv>\n            <div class=\"road-item\">2+ live customers<\u002Fdiv>\n            <div class=\"road-item\">5+ deployed nodes<\u002Fdiv>\n            <div class=\"road-item\">Unique RF dataset<\u002Fdiv>\n            <div class=\"road-item\">Seed raise<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 08 — VC GATES -->\n<section id=\"gates\" class=\"alt\">\n  <div class=\"section-num\">08 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">VC Gates<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">Seven gates to seed-ready. <em>Two are done.<\u002Fem><\u002Fh2>\n    <p class=\"body-l r\">Every serious investor will check these. Click any gate to see exactly what's required and why it matters.<\u002Fp>\n    <div class=\"gates-flex r\" id=\"gates-flex\"><\u002Fdiv>\n    <div class=\"gate-detail r\" id=\"gate-detail\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 09 — FUNDING -->\n<section id=\"funding\">\n  <div class=\"section-num\">09 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">Funding Structure<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">Non-dilutive edge. <em>Bootstrap-first.<\u002Fem><\u002Fh2>\n    <p class=\"body-l r\">The grant landscape is real but needs discipline. DIDG is not prototype money. RDTI is paid in arrears. The model is built around what is bankable, not what is hoped for.<\u002Fp>\n    <div class=\"fund-grid r\">\n      <div class=\"fund-card\">\n        <h3>Pre-seed ask — what $150k buys<\u002Fh3>\n        <p class=\"body-s\">Bridge to the first customer contract. Hardware, travel, co-founder equity, legal setup, customer discovery.<\u002Fp>\n        <div class=\"fund-row\"><span class=\"fl\">RTL-SDR hardware × 6 nodes<\u002Fspan><span class=\"fv\">$3k<\u002Fspan><\u002Fdiv>\n        <div class=\"fund-row\"><span class=\"fl\">GPSDO timing hardware<\u002Fspan><span class=\"fv\">$4k<\u002Fspan><\u002Fdiv>\n        <div class=\"fund-row\"><span class=\"fl\">Node deployment — Darwin, TS<\u002Fspan><span class=\"fv\">$12k<\u002Fspan><\u002Fdiv>\n        <div class=\"fund-row\"><span class=\"fl\">AUCloud sovereign hosting · 12 mo<\u002Fspan><span class=\"fv\">$8k<\u002Fspan><\u002Fdiv>\n        <div class=\"fund-row\"><span class=\"fl\">Legal setup + ACMA/TIA review<\u002Fspan><span class=\"fv\">$15k<\u002Fspan><\u002Fdiv>\n        <div class=\"fund-row\"><span class=\"fl\">Founder runway · 12 mo · part-time<\u002Fspan><span class=\"fv\">$60k<\u002Fspan><\u002Fdiv>\n        <div class=\"fund-row\"><span class=\"fl\">Customer discovery + D10x<\u002Fspan><span class=\"fv\">$5k<\u002Fspan><\u002Fdiv>\n        <div class=\"fund-row\"><span class=\"fl\">Buffer / contingency<\u002Fspan><span class=\"fv\">$45k<\u002Fspan><\u002Fdiv>\n        <div class=\"fund-row total\"><span class=\"fl\">Total pre-seed<\u002Fspan><span class=\"fv\">$152k<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"fund-card\">\n          <h3>Grant stack — non-dilutive<\u002Fh3>\n          <p class=\"body-s\">Stack correctly and effective R&amp;D cost drops to roughly twenty-five cents on the dollar.<\u002Fp>\n          <div class=\"fund-row\"><span class=\"fl\">R&amp;D Tax Incentive (RDTI)<\u002Fspan><span class=\"fv g\">43.5% refundable<\u002Fspan><\u002Fdiv>\n          <div class=\"fund-row\"><span class=\"fl\">ASCA — ISR / autonomous<\u002Fspan><span class=\"fv w\">$1–30M competitive<\u002Fspan><\u002Fdiv>\n          <div class=\"fund-row\"><span class=\"fl\">UNSW Defence 10x<\u002Fspan><span class=\"fv w\">$50–150k + network<\u002Fspan><\u002Fdiv>\n          <div class=\"fund-row\"><span class=\"fl\">DIDG — equipment only<\u002Fspan><span class=\"fv w\">Up to 50% match<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"caution\">\n          <div class=\"caution-l\">Grant discipline<\u002Fdiv>\n          <div class=\"caution-item\">DIDG is ineligible for product R&amp;D. Equipment, skilling, export readiness only — after the first customer.<\u002Fdiv>\n          <div class=\"caution-item\">RDTI is paid in arrears after the tax year. Never modelled as upfront cash. Logbook starts day one.<\u002Fdiv>\n          <div class=\"caution-item\">ASCA is competitive, not automatic. Treated as upside, never base case.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 10 — RESEARCH -->\n<section id=\"research\" class=\"alt\">\n  <div class=\"section-num\">10 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">Research<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">What this is built on.<\u002Fh2>\n    <p class=\"body-l r\">Every technical claim is grounded in peer-reviewed literature, real regulatory documents, and primary competitor filings. The hedges are honest. The references are open.<\u002Fp>\n    <div class=\"refs-grid r\">\n      <div class=\"refs\">\n        <h4>Core technical papers<\u002Fh4>\n        <div class=\"ref\"><span class=\"ref-n\">01<\u002Fspan><span class=\"ref-t\">Knapp &amp; Carter 1976 — GCC-PHAT original. IEEE ASSP-24(4). Still the standard after fifty years.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">02<\u002Fspan><span class=\"ref-t\">Gioia et al. 2020 — Maritime TDOA with async nodes. <a href=\"https://doi.org/10.3390/s20071842\" target=\"_blank\">DOI: 10.3390/s20071842<\u002Fa><\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">03<\u002Fspan><span class=\"ref-t\">arXiv:2502.01503 — Dark vessel trajectory reconstruction via abductive reasoning (Feb 2025).<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">04<\u002Fspan><span class=\"ref-t\">arXiv:2002.05013 — ML anomaly detection taxonomy. Broad survey applicable to AIS.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">05<\u002Fspan><span class=\"ref-t\"><a href=\"https://www.analog.com/en/education/education-library/software-defined-radio-for-engineers.html\" target=\"_blank\">SDR for Engineers<\u002Fa> — Analog Devices free PDF. SDR fundamentals.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"refs\">\n        <h4>Regulatory &amp; customer<\u002Fh4>\n        <div class=\"ref\"><span class=\"ref-n\">06<\u002Fspan><span class=\"ref-t\"><a href=\"https://www.afma.gov.au\" target=\"_blank\">AFMA Annual Reports<\u002Fa> — IUU intercept statistics, enforcement workflow, budget.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">07<\u002Fspan><span class=\"ref-t\">ABF Operation Pristis 2026 — active IUU targeting, Kimberley to Cape York.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">08<\u002Fspan><span class=\"ref-t\"><a href=\"https://www.acma.gov.au\" target=\"_blank\">ACMA radiocommunications licensing<\u002Fa> — receive-only SDR rules. Read before deploying.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">09<\u002Fspan><span class=\"ref-t\">TIA Act — metadata vs content boundary. Architecture must be metadata-only.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">10<\u002Fspan><span class=\"ref-t\"><a href=\"https://www.defence.gov.au/programs-initiatives/industry-support/defence-industry-development-grants\" target=\"_blank\">DIDG program guidelines<\u002Fa> — what is and isn't eligible.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"refs\">\n        <h4>Market &amp; competitors<\u002Fh4>\n        <div class=\"ref\"><span class=\"ref-n\">11<\u002Fspan><span class=\"ref-t\"><a href=\"https://www.hawkeye360.com\" target=\"_blank\">HawkEye 360<\u002Fa> — $98.8M US Navy Indo-Pacific IDIQ (Dec 2025). Category validator.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">12<\u002Fspan><span class=\"ref-t\"><a href=\"https://unseenlabs.com\" target=\"_blank\">Unseenlabs<\u002Fa> — Series B €28M. Dark vessel RF fingerprinting from orbit.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">13<\u002Fspan><span class=\"ref-t\"><a href=\"https://operations.amsa.gov.au/Spatial/DataServices/DigitalData\" target=\"_blank\">AMSA Spatial CTS<\u002Fa> — monthly vessel traffic datasets. Our primary data source.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">14<\u002Fspan><span class=\"ref-t\"><a href=\"https://globalfishingwatch.org\" target=\"_blank\">Global Fishing Watch<\u002Fa> — open IUU behaviour-labelled AIS data.<\u002Fspan><\u002Fdiv>\n        <div class=\"ref\"><span class=\"ref-n\">15<\u002Fspan><span class=\"ref-t\">UNSW Defence 10x Accelerator — Australia's only defence-focused accelerator.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 11 — FOUNDER & ASK -->\n<section id=\"ask\">\n  <div class=\"section-num\">11 / 11<\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"eyebrow r\">Founder &amp; Ask<\u002Fdiv>\n    <h2 class=\"r\" style=\"max-width:920px\">Built for this brief.<\u002Fh2>\n    <div class=\"ask-spread\">\n      <div class=\"r\">\n        <div class=\"founder\">\n          <div class=\"founder-mark\">KM<\u002Fdiv>\n          <div>\n            <div class=\"founder-name\">Kavan Mehta<\u002Fdiv>\n            <div class=\"founder-role\">Founder · Sydney, Australia<\u002Fdiv>\n            <p class=\"body-m\" style=\"margin-bottom:14px\">Actuarial &amp; finance (UNSW). PE analyst at Attalis Capital, building integrated investment models. AI consultant shipping Claude + MCP data platforms at NXT Bioscience. Ex-Army Reserves logistics.<\u002Fp>\n            <p class=\"body-m\" style=\"color:var(--sig);font-weight:400\">My edge is the intelligence layer and the commercial framing — not the RF hardware. The first hire is an RF / signals co-founder.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"r-r\">\n        <div class=\"kicker\" style=\"margin-bottom:24px\">The Ask<\u002Fdiv>\n        <div class=\"ask-list\">\n          <div class=\"ask-row\"><div class=\"ask-label\">Pre-seed capital<\u002Fdiv><div class=\"ask-val\">~ $150k<\u002Fdiv><\u002Fdiv>\n          <div class=\"ask-row\"><div class=\"ask-label\">RF / signals co-founder<\u002Fdiv><div class=\"ask-val\">Equity<\u002Fdiv><\u002Fdiv>\n          <div class=\"ask-row\"><div class=\"ask-label\">AFMA · ABF · MBC intros<\u002Fdiv><div class=\"ask-val\">Customer<\u002Fdiv><\u002Fdiv>\n          <div class=\"ask-row\"><div class=\"ask-label\">UNSW Defence 10x place<\u002Fdiv><div class=\"ask-val\">Accelerator<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"contact-cta\">\n          <div class=\"contact-cta-t\">Validate first.<br>Claim second.<br>Build sovereign.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Reach Out -->\n    <div class=\"r\" style=\"margin-top:80px;padding-top:64px;border-top:1px solid var(--line)\">\n      <div class=\"eyebrow\">Reach Out<\u002Fdiv>\n      <h3 style=\"font:500 36px/1.15 var(--serif);color:var(--head);letter-spacing:-.02em;margin-bottom:14px\">Get in touch.<\u002Fh3>\n      <p class=\"body-l\" style=\"margin-bottom:48px\">Investors, RF / signals engineers, defence operators — every credible introduction matters.<\u002Fp>\n      <div class=\"reach-grid\">\n        <a class=\"reach-card\" href=\"mailto:kavan.mehta@attaliscapital.com\">\n          <div class=\"reach-l\">Email<\u002Fdiv>\n          <div class=\"reach-v\">kavan.mehta@attaliscapital.com<\u002Fdiv>\n        <\u002Fa>\n        <a class=\"reach-card\" href=\"tel:+61481373635\">\n          <div class=\"reach-l\">Phone<\u002Fdiv>\n          <div class=\"reach-v\">+61 481 373 635<\u002Fdiv>\n        <\u002Fa>\n        <a class=\"reach-card\" href=\"https://www.linkedin.com/in/kavan-mehta-801626277/\" target=\"_blank\" rel=\"noopener\">\n          <div class=\"reach-l\">LinkedIn<\u002Fdiv>\n          <div class=\"reach-v\">kavan-mehta-801626277 ↗<\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <div class=\"f-mark\">BOOBOOK<\u002Fdiv>\n  <div class=\"f-disc\">Pre-seed sovereign Australian maritime intelligence. All technical claims are hedged to current validation state. AIS anomalies are not proof of illegal behaviour. RF capability is simulation until field-tested. Built by Attalis Capital.<\u002Fdiv>\n  <div class=\"f-links\">\n    <a href=\"https://www.linkedin.com/in/kavan-mehta-801626277/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\u002Fa>\n    <a href=\"dashboard.html\">Dashboard<\u002Fa>\n    <a href=\"mailto:kavan.mehta@attaliscapital.com\">Contact<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n// ── HERO MAP ──────────────────────────────────────────────────────────────\nconst heroMap=L.map('hero-map',{center:[-11.5,136],zoom:5,zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,keyboard:false});\nL.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:10}).addTo(heroMap);\nconst heroTracks=[\n  [[-10.95,141.8],[-10.85,142.1],[-10.75,142.4],[-10.65,142.7],[-10.58,142.9]],\n  [[-11.2,141.5],[-11.1,141.9],[-11.0,142.3],[-10.9,142.6]],\n  [[-10.3,143.2],[-10.4,142.9],[-10.5,142.5],[-10.6,142.1]],\n  [[-12.3,131.0],[-12.4,131.5],[-12.5,132.0]],\n  [[-13.5,128.5],[-13.6,129.0],[-13.7,129.5]],\n];\nheroTracks.forEach((t,i)=>{\n  const c=i<3?'#00e5c4':'rgba(0,229,196,.6)';\n  L.polyline(t,{color:c,weight:1.2,opacity:.5}).addTo(heroMap);\n  L.circleMarker(t[t.length-1],{radius:3,fillColor:c,color:'transparent',fillOpacity:.7}).addTo(heroMap);\n});\n[[-10.58,142.22],[-12.45,130.84],[-11.72,136.5],[-14.93,128.12]].forEach(pos=>{\n  const ic=L.divIcon({html:'<div style=\"width:6px;height:6px;border-radius:50%;background:#00e5c4;box-shadow:0 0 10px #00e5c4\"><\u002Fdiv>',className:'',iconSize:[6,6],iconAnchor:[3,3]});\n  L.marker(pos,{icon:ic}).addTo(heroMap);\n  L.circle(pos,{radius:40000,color:'rgba(0,229,196,.1)',fill:false,weight:.6,dashArray:'3 7'}).addTo(heroMap);\n});\n\n// ── CINEMATIC SCENARIO ────────────────────────────────────────────────────\nconst scMap=L.map('sc-map',{center:[-10.8,142.2],zoom:8,zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,keyboard:false});\nL.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(scMap);\nL.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,opacity:.25}).addTo(scMap);\n[[-10.58,142.22,'TS Alpha'],[-10.85,142.65,'TS Beta']].forEach(([lat,lon,name])=>{\n  const ic=L.divIcon({html:'<div style=\"position:relative;width:14px;height:14px\"><div style=\"position:absolute;inset:0;border-radius:50%;background:rgba(0,229,196,.12);animation:sc-pulse 3s ease-out infinite\"><\u002Fdiv><div style=\"position:absolute;inset:4px;border-radius:50%;background:#00e5c4;box-shadow:0 0 10px #00e5c4\"><\u002Fdiv><\u002Fdiv>',className:'',iconSize:[14,14],iconAnchor:[7,7]});\n  L.marker([lat,lon],{icon:ic}).addTo(scMap);\n  L.circle([lat,lon],{radius:45000,color:'rgba(0,229,196,.08)',fill:false,weight:.6,dashArray:'5 10',interactive:false}).addTo(scMap);\n});\nif(!document.getElementById('sc-pulse-style')){\n  const s=document.createElement('style');s.id='sc-pulse-style';\n  s.textContent='@keyframes sc-pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(3.5);opacity:0}}';\n  document.head.appendChild(s);\n}\n\nconst SC_TRACK=[[-10.2,143.4],[-10.25,143.2],[-10.32,143.0],[-10.38,142.85],[-10.42,142.7],[-10.48,142.55],[-10.52,142.42],[-10.55,142.30],[-10.56,142.18]];\nconst SC_RF_FIX=[-10.62,141.90];\n\n// ═══ SCENARIO STATE MACHINE ═══\nlet scLayers=[],scStep=-1,scMode='step',scAutoTimer=null,scAnimating=false,scStarted=false;\n\nfunction clearSc(){scLayers.forEach(l=>{try{scMap.removeLayer(l)}catch(e){}});scLayers=[]}\n\n// Step definitions — each has visual setup + narration + investor analysis\nconst SC_STEPS=[\n  {\n    title:'Normal transit',\n    duration:3000,\n    apply:async (instant)=>{\n      // Map context\n      if(!instant){scMap.flyTo([-10.45,142.6],9,{duration:1.2})}else{scMap.setView([-10.45,142.6],9)}\n      // Background tracks (dim)\n      [[[-10.9,141.8],[-10.75,142.1],[-10.6,142.4],[-10.5,142.7]],[[-10.3,143.2],[-10.4,142.9],[-10.5,142.5],[-10.6,142.1]],[[-10.8,143.5],[-10.7,143.0],[-10.6,142.5]],[[-11.0,142.8],[-10.9,142.5],[-10.8,142.2]]].forEach(t=>{\n        scLayers.push(L.polyline(t,{color:'#00e5c4',weight:1,opacity:.12}).addTo(scMap));\n        scLayers.push(L.circleMarker(t[t.length-1],{radius:2.5,fillColor:'#00e5c4',color:'transparent',fillOpacity:.15}).addTo(scMap));\n      });\n      // Main vessel track\n      const trackLine=L.polyline([],{color:'#00e5c4',weight:2.5,opacity:.9}).addTo(scMap);\n      const vesselDot=L.circleMarker(SC_TRACK[0],{radius:6,fillColor:'#00e5c4',color:'rgba(0,229,196,.3)',weight:3,fillOpacity:1}).addTo(scMap);\n      scLayers.push(trackLine,vesselDot);\n      if(instant){\n        SC_TRACK.forEach(p=>trackLine.addLatLng(p));\n        vesselDot.setLatLng(SC_TRACK[SC_TRACK.length-1]);\n      }else{\n        await wait(800);\n        for(let i=0;i<SC_TRACK.length;i++){\n          trackLine.addLatLng(SC_TRACK[i]);\n          vesselDot.setLatLng(SC_TRACK[i]);\n          await wait(180);\n        }\n      }\n      // Stash for later steps\n      scLayers._vesselDot=vesselDot;\n    },\n    narr:'<b>Torres Strait, northern Australia.<\u002Fb> A 28-metre fishing vessel transits the channel. AIS broadcasting normally — position every six seconds.',\n    inv:'This is the baseline. <em>AIS-only analytics<\u002Fem> — what Windward and Spire sell today — works perfectly here. Every cooperative vessel shows up. The problem is everything that happens next.',\n    tel:[['VESSEL','MMSI 503001847','#fff'],['TYPE','Fishing · 28m','rgba(255,255,255,.6)'],['AIS STATUS','ACTIVE','#00e5c4'],['RISK SCORE','12 / 100','#00e5c4']]\n  },\n  {\n    title:'AIS goes silent',\n    duration:3500,\n    apply:async (instant)=>{\n      // Rebuild from prior state if jumping\n      if(!scLayers._vesselDot){await SC_STEPS[0].apply(true)}\n      const vesselDot=scLayers._vesselDot;\n      vesselDot.setStyle({fillColor:'#ff4538',color:'rgba(255,69,56,.3)'});\n      const lkp=SC_TRACK[SC_TRACK.length-1];\n      const pulseRing=L.circleMarker(lkp,{radius:22,color:'rgba(255,69,56,.3)',fill:false,weight:2}).addTo(scMap);\n      const darkZone=L.circle(lkp,{radius:18000,color:'rgba(255,69,56,.2)',fill:true,fillColor:'rgba(255,69,56,.04)',fillOpacity:1,weight:1,dashArray:'6 8'}).addTo(scMap);\n      scLayers.push(pulseRing,darkZone);\n      scLayers._darkZone=darkZone;\n    },\n    narr:'<span class=\"sc-warn\">⊘ AIS GOES SILENT.<\u002Fspan> No broadcast received for eight hours. The vessel has gone dark — gone from every system that watches.',\n    inv:'<em>This is the gap in the market.<\u002Fem> AIS-only platforms cannot distinguish a disabled transponder from a lost signal. The vessel disappears. Enforcement either ignores it or burns a patrol asset on speculation.',\n    tel:[['VESSEL','MMSI 503001847','#fff'],['AIS STATUS','SILENT · 8h','#ff4538'],['LAST POSITION','-10.56°, 142.18°','rgba(255,255,255,.6)'],['RISK SCORE','87 / 100','#ff4538']]\n  },\n  {\n    title:'RF emission detected',\n    duration:3500,\n    apply:async (instant)=>{\n      if(!scLayers._vesselDot){await SC_STEPS[0].apply(true);await SC_STEPS[1].apply(true)}\n      const lkp=SC_TRACK[SC_TRACK.length-1];\n      scLayers.push(L.polyline([lkp,SC_RF_FIX],{color:'#ff4538',weight:1.5,opacity:.5,dashArray:'6 6'}).addTo(scMap));\n      const rfDot=L.circleMarker(SC_RF_FIX,{radius:7,fillColor:'#00e5c4',color:'rgba(0,229,196,.3)',weight:4,fillOpacity:1}).addTo(scMap);\n      scLayers.push(rfDot);\n      [[-10.58,142.22],[-10.85,142.65]].forEach(s=>scLayers.push(L.polyline([s,SC_RF_FIX],{color:'rgba(0,229,196,.25)',weight:1,dashArray:'3 6'}).addTo(scMap)));\n      if(!instant)scMap.flyTo([-10.6,142.0],9,{duration:1});else scMap.setView([-10.6,142.0],9);\n    },\n    narr:'<b>RF EMISSION DETECTED.<\u002Fb> The vessel\\'s VHF radio is still active on Ch 16. Three ground nodes hear it. TDOA cross-correlation computes a position fix in under thirty seconds.',\n    inv:'This is the technical moat. GCC-PHAT is <em>fifty years old<\u002Fem> and validated by every SIGINT agency. The novelty isn\\'t the algorithm — it\\'s running it persistently over Australian chokepoints from sovereign infrastructure.',\n    tel:[['RF SOURCE','VHF Ch 16 · 156.8 MHz','#00e5c4'],['TDOA FIX','-10.62°, 141.90°','#00e5c4'],['CEP₅₀','~1.5 km','rgba(255,255,255,.6)'],['LATENCY','< 30 seconds','#00e5c4']]\n  },\n  {\n    title:'Alert generated',\n    duration:3000,\n    apply:async (instant)=>{\n      if(!scLayers._vesselDot){await SC_STEPS[0].apply(true);await SC_STEPS[1].apply(true);await SC_STEPS[2].apply(true)}\n      // No new visual — just emphasis via narration/telemetry\n    },\n    narr:'<span class=\"sc-amb\">⚡ RF present, AIS absent.<\u002Fspan> Risk score 87/100. The system flags a detection opportunity with full evidence chain and recommended enforcement action.',\n    inv:'<em>This is the product.<\u002Fem> Not raw data — actionable intelligence with an audit trail. Government customers cannot procure a black box. Every score is explainable. Every alert defensible. AFMA and ABF buy decisions, not feeds.',\n    tel:[['ALERT TYPE','AIS Gap + RF Fix','#f59e0b'],['RISK SCORE','87 / 100','#ff4538'],['CORRELATION','Confirmed dark vessel','#f59e0b'],['EVIDENCE CHAIN','Complete','#00e5c4'],['ACTION','Dispatch patrol asset','rgba(255,255,255,.6)']]\n  },\n  {\n    title:'Search area collapses',\n    duration:4000,\n    apply:async (instant)=>{\n      if(!scLayers._vesselDot){await SC_STEPS[0].apply(true);await SC_STEPS[1].apply(true);await SC_STEPS[2].apply(true)}\n      // Remove dark zone, add tight search circle\n      if(scLayers._darkZone){try{scMap.removeLayer(scLayers._darkZone)}catch(e){}}\n      scLayers.push(L.circle(SC_RF_FIX,{radius:1500,color:'#00e5c4',fillColor:'rgba(0,229,196,.08)',fillOpacity:1,weight:2,dashArray:'6 4'}).addTo(scMap));\n      if(!instant)scMap.flyTo(SC_RF_FIX,10,{duration:1});else scMap.setView(SC_RF_FIX,10);\n    },\n    narr:'<b>Open ocean → 7 km².<\u002Fb> Without Boobook, enforcement searches the entire strait. With a TDOA fix, patrol assets are on scene in minutes — not hours.',\n    inv:'<em>This is the dollar value.<\u002Fem> Search-area reduction translates directly into fewer patrol hours, faster intercepts, more enforceable detections. That is the SAM — and the reason AFMA, ABF and MBC are credible buyers.',\n    tel:[['WITHOUT BOOBOOK','~ 8.1M km² EEZ','rgba(255,255,255,.3)'],['WITH TDOA FIX','~ 7 km² fix circle','#00e5c4'],['REDUCTION','~ 99.99999%','#00e5c4'],['TIME TO CUE','< 2 minutes','#00e5c4'],['SOVEREIGN','Australian ground layer','#00e5c4']]\n  }\n];\n\nfunction wait(ms){return new Promise(r=>setTimeout(r,ms))}\n\n// ═══ SPY EFFECT HELPERS ═══\nfunction triggerScanLine(){\n  let el=document.querySelector('.sc-scan-overlay');\n  if(!el){\n    el=document.createElement('div');\n    el.className='sc-scan-overlay';\n    document.getElementById('sc-viewport').appendChild(el);\n  }\n  el.classList.remove('show');\n  void el.offsetHeight; // reflow\n  el.classList.add('show');\n  setTimeout(()=>el.classList.remove('show'),1500);\n}\n\nfunction attachReticle(latlng,color){\n  removeReticle();\n  const pt=scMap.latLngToContainerPoint(latlng);\n  const r=document.createElement('div');\n  r.className='sc-reticle'+(color==='teal'?' teal':'');\n  r.id='sc-reticle';\n  r.innerHTML='<div class=\"rcorn tl\"><\u002Fdiv><div class=\"rcorn tr\"><\u002Fdiv><div class=\"rcorn bl\"><\u002Fdiv><div class=\"rcorn br\"><\u002Fdiv><div class=\"rdot\"><\u002Fdiv>';\n  r.style.left=(pt.x-40)+'px';\n  r.style.top=(pt.y-40)+'px';\n  // Position relative to viewport not map\n  document.getElementById('sc-viewport').appendChild(r);\n  // Keep it locked on the latlng during map pans\n  const update=()=>{\n    if(!document.getElementById('sc-reticle'))return;\n    const p=scMap.latLngToContainerPoint(latlng);\n    r.style.left=(p.x-40)+'px';\n    r.style.top=(p.y-40)+'px';\n  };\n  scMap.on('move zoom',update);\n  r._update=update;\n}\nfunction removeReticle(){\n  const r=document.getElementById('sc-reticle');\n  if(r){if(r._update)scMap.off('move zoom',r._update);r.remove()}\n}\n\nfunction pulseSensors(){\n  // Add temporary pulse-wave divs at sensor pixel positions\n  [[-10.58,142.22],[-10.85,142.65]].forEach(s=>{\n    const pt=scMap.latLngToContainerPoint(s);\n    const w=document.createElement('div');\n    w.className='sc-pulse-wave';\n    w.style.left=(pt.x-20)+'px';\n    w.style.top=(pt.y-20)+'px';\n    document.getElementById('sc-viewport').appendChild(w);\n    setTimeout(()=>w.remove(),3600);\n  });\n}\n\nfunction glitchify(html){\n  // Wrap key emphasized text in glitch span for steps 2 + 4\n  return html.replace(/<span class=\"sc-warn\">([^<]+)<\\/span>/,(_,t)=>'<span class=\"sc-warn sc-glitch\" data-text=\"'+t+'\">'+t+'<\u002Fspan>')\n             .replace(/<span class=\"sc-amb\">([^<]+)<\\/span>/,(_,t)=>'<span class=\"sc-amb sc-glitch\" data-text=\"'+t+'\">'+t+'<\u002Fspan>');\n}\n\nfunction renderSteps(){\n  const el=document.getElementById('sc-stepper');\n  if(!el)return;\n  el.innerHTML='';\n  SC_STEPS.forEach((s,i)=>{\n    const b=document.createElement('button');\n    b.className='sc-stepb'+(i===scStep?' active':'')+(i<scStep?' done':'');\n    b.innerHTML='<span class=\"sc-stepb-num\">'+(i<scStep?'\\u2713':(i+1))+'<\u002Fspan><span class=\"sc-stepb-t\">'+s.title+'<\u002Fspan>';\n    b.onclick=()=>goToStep(i);\n    el.appendChild(b);\n  });\n}\nfunction renderBreakdown(i){\n  const idx=(SC_STEPS[i]?i:0);const s=SC_STEPS[idx];\n  const stepEl=document.getElementById('scb-step');if(stepEl)stepEl.textContent='Step 0'+(idx+1)+' · '+s.title;\n  const m=document.getElementById('scb-metrics');\n  if(m)m.innerHTML=s.tel.map(([k,v,c])=>'<div class=\"scb-metric\"><div class=\"scb-metric-l\">'+k+'<\u002Fdiv><div class=\"scb-metric-v\" style=\"color:'+(c||'#fff')+'\">'+v+'<\u002Fdiv><\u002Fdiv>').join('');\n  const a=document.getElementById('scb-analysis');if(a)a.innerHTML=s.inv;\n}\n\nfunction setTel(rows){\n  const el=document.getElementById('sc-tel'); if(!el)return;\n  el.innerHTML=rows.map(([k,v,c])=>'<div class=\"sc-tel-row\"><span>'+k+'<\u002Fspan><span style=\"color:'+(c||'#fff')+';font-weight:500\">'+v+'<\u002Fspan><\u002Fdiv>').join('');\n}\n\nfunction updateUI(){\n  const s=SC_STEPS[scStep];\n  if(!s)return;\n  // Narration with glitch effect on alert text\n  document.getElementById('sc-narr').innerHTML='<div class=\"sc-step\">Step 0'+(scStep+1)+' · '+s.title+'<\u002Fdiv>'+glitchify(s.narr);\n  const _invb=document.getElementById('sc-inv-b');if(_invb)_invb.innerHTML=s.inv;\n  setTel(s.tel);\n  // Nav\n  document.getElementById('sc-nav-step').textContent='Step '+(scStep+1)+' of '+SC_STEPS.length;\n  document.getElementById('sc-prev').disabled=scStep===0;\n  const nextBtn=document.getElementById('sc-next');\n  nextBtn.disabled=false;\n  if(scStep===SC_STEPS.length-1){nextBtn.textContent='↻ Restart'}else{nextBtn.textContent='Next →'}\n  renderSteps();\n  renderBreakdown(scStep);\n  // Spy effects per step\n  triggerScanLine();\n  // Reticle management\n  if(scStep===0){removeReticle()}\n  else if(scStep===1){\n    // RED reticle locks on last known position (where it went dark)\n    const lkp=SC_TRACK[SC_TRACK.length-1];\n    setTimeout(()=>attachReticle(lkp,'red'),200);\n  } else if(scStep===2){\n    // TEAL reticle moves to RF fix\n    setTimeout(()=>{attachReticle(SC_RF_FIX,'teal');pulseSensors()},400);\n  } else if(scStep===3){\n    // Keep teal reticle on RF fix\n  } else if(scStep===4){\n    // Keep teal reticle\n  }\n}\n\nasync function goToStep(i,instant){\n  if(scAnimating)return;\n  if(i<0||i>=SC_STEPS.length)return;\n  scAnimating=true;\n  // Cancel any auto-play\n  if(scAutoTimer){clearTimeout(scAutoTimer);scAutoTimer=null}\n  // Remove existing pulse waves & old reticle for rebuild\n  document.querySelectorAll('.sc-pulse-wave').forEach(p=>p.remove());\n  // Rebuild from scratch if jumping backwards or skipping\n  if(i<=scStep||i>scStep+1){\n    removeReticle();\n    clearSc();\n    scStep=-1;\n    for(let k=0;k<=i;k++){\n      scStep=k;\n      await SC_STEPS[k].apply(true);\n    }\n  } else {\n    // Sequential next\n    scStep=i;\n    await SC_STEPS[i].apply(instant||scMode==='step');\n  }\n  updateUI();\n  scAnimating=false;\n  // Continue auto-play if mode is auto\n  if(scMode==='auto'&&scStep<SC_STEPS.length-1){\n    scAutoTimer=setTimeout(()=>goToStep(scStep+1),SC_STEPS[scStep].duration);\n  }\n}\n\nfunction nextStep(){\n  if(scStep===SC_STEPS.length-1){\n    // Restart\n    clearSc();\n    scStep=-1;\n    goToStep(0);\n  } else {\n    goToStep(scStep+1);\n  }\n}\nfunction prevStep(){\n  if(scStep>0)goToStep(scStep-1,true);\n}\n\nfunction setMode(m){\n  scMode=m;\n  document.getElementById('sc-mb-step').classList.toggle('on',m==='step');\n  document.getElementById('sc-mb-auto').classList.toggle('on',m==='auto');\n  if(scAutoTimer){clearTimeout(scAutoTimer);scAutoTimer=null}\n  if(m==='auto'&&scStep>=0&&scStep<SC_STEPS.length-1){\n    scAutoTimer=setTimeout(()=>goToStep(scStep+1),1500);\n  }\n}\n\nfunction startScenario(){\n  if(scStarted)return;\n  scStarted=true;\n  document.getElementById('sc-play').classList.add('hide');\n  document.getElementById('sc-top').classList.add('show');\n  const _st=document.getElementById('sc-stats');if(_st)_st.style.opacity='1';\n  document.getElementById('sc-bottom').classList.add('show');\n  goToStep(0);\n}\n\n// Auto-trigger on scroll into view\nlet scAutoTriggered=false;\nnew IntersectionObserver(es=>{\n  if(es[0].isIntersecting&&!scAutoTriggered){\n    scAutoTriggered=true;\n    setTimeout(startScenario,600);\n  }\n},{threshold:0.4}).observe(document.getElementById('sc-viewport'));\n\n// ── DEMO: reveal the interactive controls + breakdown immediately (no play-gate) ──\nrenderBreakdown(0);\n(function initDemo(){\n  scStarted=true;\n  const play=document.getElementById('sc-play');if(play)play.classList.add('hide');\n  document.getElementById('sc-top').classList.add('show');\n  const _st=document.getElementById('sc-stats');if(_st)_st.style.opacity='1';\n  document.getElementById('sc-bottom').classList.add('show');\n  goToStep(0,true);\n})();\n\n// ── VC GATES ──────────────────────────────────────────────────────────────\nconst GATES=[\n  {num:'G1',name:'Live AIS capture',status:'done',reqs:['RTL-SDR receiving Sydney Harbour AIS','pyais decoding NMEA to TimescaleDB','Dashboard showing real tracks (not synthetic)','Converts simulator to real signal system'],whys:['Proves the software stack works on real signals','One sentence that changes every investor conversation','Gives real anomaly data, not generated rows']},\n  {num:'G2',name:'Real AMSA data',status:'done',reqs:['AMSA monthly CTS shapefiles downloaded','34,498 rows processed, 1,480 alerts','Dashboard running on official Australian data','AMSA identified as primary sovereign source'],whys:['Proves anomaly logic on real-world vessel behaviour','Gives investors something non-synthetic to look at','Establishes AMSA as credible institutional source']},\n  {num:'G3',name:'RF co-founder',status:'now',reqs:['Ex-ADF signals / DSTG / UNSW EE background','Real SDR/GNU Radio field experience','Willing to co-found or advise with equity','Can explain TDOA physics credibly'],whys:['Every investor asks \"who is your RF person\"','Without this: one person who vibecoded a sim','UNSW D10x application far stronger with this']},\n  {num:'G4',name:'3-node TDOA',status:'next',reqs:['3 receivers + known transmitter + known position','GPS-disciplined timing on all nodes','Measured position error vs known truth','Honest write-up: CEP at km baseline'],whys:['Transforms RF claim from theoretical to validated','What no satellite competitor can say about a fixed corridor','Required for ASCA + any defence customer']},\n  {num:'G5',name:'Paying customer',status:'next',reqs:['Signed contract — AFMA/ABF/port/insurer','Recurring annual monitoring fee','$50–150k ARR minimum','Customer agrees to be referenced'],whys:['Without revenue, raising on hope only','One customer changes entire risk profile','Government = sticky, high-NRR, low churn']},\n  {num:'G6',name:'Unique dataset',status:'next',reqs:['30+ days continuous AIS+RF from one location','Labelled anomaly events with ground truth','Sovereign infrastructure (AUCloud Sydney)','Demonstrably unique Australian corridor data'],whys:['Data is the moat — code can be copied','Acquirers buy data + relationships, not software','Every month makes company harder to replicate']},\n  {num:'G7',name:'Monthly model',status:'next',reqs:['24-month month-by-month cashflow','Conservative: no grant until month 18','Node BOM with real ruggedisation costs','No-contract-until-month-12 survival case'],whys:['Annual view hides 6-month trough before first contract','Investors build this anyway — better if you did first','Shows you understand the actual risk']},\n];\nconst gBadge={done:'gs-done',now:'gs-now',next:'gs-next'};\nconst gLabel={done:'Done',now:'Do now',next:'Next'};\nlet selGate=2;\nfunction buildGates(){\n  const gg=document.getElementById('gates-flex');gg.innerHTML='';\n  GATES.forEach((g,i)=>{\n    const d=document.createElement('div');\n    d.className='gate '+(g.status==='done'?'done':'')+(selGate===i?' on':'');\n    d.innerHTML='<div class=\"gate-n\">'+g.num+'<\u002Fdiv><div class=\"gate-name\">'+g.name+'<\u002Fdiv><span class=\"gate-status '+gBadge[g.status]+'\">'+gLabel[g.status]+'<\u002Fspan>';\n    d.onclick=()=>{selGate=i;buildGates();showGate(i)};\n    gg.appendChild(d);\n  });\n}\nfunction showGate(i){\n  const g=GATES[i];\n  document.getElementById('gate-detail').innerHTML=\n    '<div class=\"gd-title\">'+g.num+': '+g.name+' <span class=\"gate-status '+gBadge[g.status]+'\">'+gLabel[g.status]+'<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"gd-cols\">'+\n    '<div><div class=\"gd-col-l\">What\\'s required<\u002Fdiv>'+g.reqs.map(r=>'<div class=\"gd-req\">'+r+'<\u002Fdiv>').join('')+'<\u002Fdiv>'+\n    '<div><div class=\"gd-col-l\">Why investors care<\u002Fdiv>'+g.whys.map(w=>'<div class=\"gd-req\" style=\"border-color:rgba(245,158,11,.1)\">'+w+'<\u002Fdiv>').join('')+'<\u002Fdiv>'+\n    '<\u002Fdiv>';\n}\nbuildGates();showGate(2);\n\n// ── SCROLL REVEAL ─────────────────────────────────────────────────────────\nconst revealObserver=new IntersectionObserver((entries)=>{\n  entries.forEach(e=>{\n    if(e.isIntersecting){\n      const parent=e.target.parentElement;\n      if(parent){\n        const siblings=[...parent.querySelectorAll(':scope > .r, :scope > .r-l, :scope > .r-r, :scope > .r-up')];\n        const idx=siblings.indexOf(e.target);\n        if(idx>=0)e.target.style.transitionDelay=(idx*60)+'ms';\n      }\n      e.target.classList.add('in');\n      revealObserver.unobserve(e.target);\n    }\n  });\n},{threshold:0.1,rootMargin:'-30px'});\ndocument.querySelectorAll('.r, .r-l, .r-r, .r-up').forEach(el=>revealObserver.observe(el));\n\n// ── COUNTER ANIMATION ─────────────────────────────────────────────────────\nconst counterObserver=new IntersectionObserver((entries)=>{\n  entries.forEach(e=>{\n    if(e.isIntersecting&&!e.target._counted){\n      e.target._counted=true;\n      const text=e.target.textContent;\n      const num=parseFloat(text.replace(/[^0-9.]/g,''));\n      if(isNaN(num)||num===0)return;\n      const prefix=text.match(/^[^0-9]*/)[0]||'';\n      const suffix=text.match(/[^0-9.]*$/)[0]||'';\n      const isInt=!text.includes('.');\n      const duration=1400;\n      const start=performance.now();\n      (function tick(now){\n        const p=Math.min((now-start)/duration,1);\n        const ease=1-Math.pow(1-p,3);\n        const v=num*ease;\n        e.target.textContent=prefix+(isInt?Math.round(v).toLocaleString():v.toFixed(1))+suffix;\n        if(p<1)requestAnimationFrame(tick);\n        else e.target.textContent=text;\n      })(performance.now());\n      counterObserver.unobserve(e.target);\n    }\n  });\n},{threshold:0.3});\ndocument.querySelectorAll('.hm-v, .mt-v, .big-stat-v').forEach(el=>counterObserver.observe(el));\n\n// ── NAV ACTIVE ────────────────────────────────────────────────────────────\nconst navLinks=document.querySelectorAll('.n-links a');\nconst navSections=document.querySelectorAll('section[id]');\nnew IntersectionObserver((entries)=>{\n  entries.forEach(e=>{\n    if(e.isIntersecting){\n      navLinks.forEach(l=>l.classList.remove('on'));\n      const link=document.querySelector('.n-links a[href=\"#'+e.target.id+'\"]');\n      if(link)link.classList.add('on');\n    }\n  });\n},{threshold:0.3});\nnavSections.forEach(s=>{\n  new IntersectionObserver((entries)=>{\n    entries.forEach(e=>{\n      if(e.isIntersecting){\n        navLinks.forEach(l=>l.classList.remove('on'));\n        const link=document.querySelector('.n-links a[href=\"#'+e.target.id+'\"]');\n        if(link)link.classList.add('on');\n      }\n    });\n  },{threshold:0.3}).observe(s);\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
