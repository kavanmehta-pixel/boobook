document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);\n  --dim:rgba(255,255,255,.2);--muted:rgba(255,255,255,.45);\n  --body:rgba(255,255,255,.74);--head:rgba(255,255,255,.96);\n  --sig:#00e5c4;--sig2:#00d1b8;--sigbg:rgba(0,229,196,.05);--sigb:rgba(0,229,196,.18);\n  --red:#ff4538;--amb:#f59e0b;\n  --serif:'Newsreader',Georgia,serif;\n  --sans:'Inter',system-ui,sans-serif;\n  --mono:'JetBrains Mono',monospace;\n}\nhtml{scroll-behavior:smooth}\nbody{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}\n::selection{background:rgba(0,229,196,.25);color:var(--head)}\na{color:inherit;text-decoration:none}\n\n/* ═══ SCROLL REVEAL ═══ */\n.r{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}\n.r.in{opacity:1;transform:none}\n.r-l{opacity:0;transform:translateX(-32px);transition:all .9s cubic-bezier(.16,1,.3,1)}\n.r-l.in{opacity:1;transform:none}\n.r-r{opacity:0;transform:translateX(32px);transition:all .9s cubic-bezier(.16,1,.3,1)}\n.r-r.in{opacity:1;transform:none}\n.r-up{opacity:0;transform:translateY(8px);transition:all .8s cubic-bezier(.16,1,.3,1)}\n.r-up.in{opacity:1;transform:none}\n\n/* ═══ NAV ═══ */\nnav{position:fixed;top:0;left:0;right:0;z-index:1000;height:64px;\n  background:rgba(4,14,27,.8);backdrop-filter:blur(20px) saturate(1.4);\n  border-bottom:1px solid var(--line);\n  display:flex;align-items:center;padding:0 clamp(20px,4vw,48px);transition:background .3s}\n.n-mark{display:flex;align-items:center;gap:10px}\n.n-pulse{width:6px;height:6px;border-radius:50%;background:var(--sig);box-shadow:0 0 10px var(--sig);animation:pulse 2.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}\n.n-logo{font:600 13px/1 var(--mono);letter-spacing:5px;color:var(--head)}\n.n-links{display:flex;gap:2px;margin-left:48px;flex:1}\n.n-links a{font:500 12px/1 var(--mono);letter-spacing:.3px;color:var(--muted);padding:8px 14px;border-radius:4px;transition:color .15s}\n.n-links a:hover,.n-links a.on{color:var(--sig)}\n.n-right{display:flex;gap:8px;align-items:center}\n.n-btn{font:600 10px/1 var(--mono);letter-spacing:2px;padding:9px 16px;border-radius:4px;transition:all .15s;text-transform:uppercase}\n.n-btn.ghost{border:1px solid var(--line2);color:var(--muted)}\n.n-btn.ghost:hover{border-color:var(--sigb);color:var(--sig)}\n.n-btn.solid{background:var(--sig);color:var(--ink);font-weight:700}\n.n-btn.solid:hover{opacity:.86}\n\n/* ═══ SECTIONS ═══ */\nsection{position:relative;padding:140px clamp(24px,5vw,80px)}\n.wrap{max-width:1240px;margin:0 auto;position:relative}\n.eyebrow{font:600 10px/1 var(--mono);letter-spacing:3px;color:var(--sig);text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:24px}\n.eyebrow::before{content:'';width:24px;height:1px;background:var(--sig)}\n.eyebrow.mid::before,.eyebrow.mid::after{content:'';flex:1;height:1px;background:var(--sigb);max-width:60px}\n.eyebrow.mid::after{display:inline-block}\n.section-num{position:absolute;top:120px;right:clamp(24px,5vw,80px);font:300 14px/1 var(--mono);color:var(--dim);letter-spacing:2px}\n.alt{background:var(--bg2)}\n\n/* ═══ TYPOGRAPHY ═══ */\nh1,h2,h3{font-family:var(--serif);font-weight:500;color:var(--head);letter-spacing:-.02em}\nh1{font-size:clamp(56px,7vw,96px);line-height:1.02;letter-spacing:-.03em}\nh2{font-size:clamp(36px,4.5vw,60px);line-height:1.08;margin-bottom:24px}\nh2 em{font-style:italic;font-weight:400;color:var(--sig)}\nh3{font-size:clamp(22px,2.4vw,30px);line-height:1.2}\n.body-l{font-size:19px;line-height:1.65;color:var(--body);max-width:680px;font-weight:300}\n.body-m{font-size:16px;line-height:1.7;color:var(--body);max-width:600px;font-weight:300}\n.body-s{font-size:14px;line-height:1.7;color:var(--muted);font-weight:400}\n.hand{font-family:var(--sans);font-weight:500}\n.mono{font-family:var(--mono);font-weight:400}\n.kicker{font:500 11px/1 var(--mono);color:var(--sig);letter-spacing:2.5px;text-transform:uppercase}\n\n/* ═══ HERO ═══ */\n#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:120px clamp(24px,5vw,80px) 80px;position:relative;overflow:hidden}\n.hero-bg{position:absolute;inset:0;z-index:0}\n#hero-map{position:absolute;inset:0;opacity:.16}\n.hero-vignette{position:absolute;inset:0;\n  background:radial-gradient(ellipse 75% 75% at 50% 50%,transparent 25%,var(--bg) 90%),\n             linear-gradient(180deg,var(--bg) 0%,transparent 15%,transparent 85%,var(--bg) 100%)}\n.hero-content{position:relative;z-index:2;max-width:1240px;margin:0 auto;width:100%}\n.hero-kicker{font:500 11px/1 var(--mono);color:var(--sig);letter-spacing:5px;text-transform:uppercase;margin-bottom:32px;display:inline-flex;align-items:center;gap:14px}\n.hero-kicker::before{content:'';width:30px;height:1px;background:var(--sig)}\n.hero-meta{margin-top:80px;padding-top:32px;border-top:1px solid var(--line);\n  display:grid;grid-template-columns:repeat(4,1fr);gap:48px}\n.hm-i{display:flex;flex-direction:column;gap:4px}\n.hm-v{font:300 36px/1 var(--serif);color:var(--head);letter-spacing:-.01em}\n.hm-l{font:400 12px/1.5 var(--sans);color:var(--muted);max-width:200px}\n.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:2;\n  font:500 10px/1 var(--mono);letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;\n  display:flex;flex-direction:column;align-items:center;gap:8px;animation:bob 2.4s ease-in-out infinite}\n.hero-scroll::after{content:'';width:1px;height:28px;background:linear-gradient(to bottom,var(--sig),transparent)}\n@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}\n\n/* ═══ PROBLEM ═══ */\n.spread{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}\n.spread-wide{display:grid;grid-template-columns:1fr 1.4fr;gap:80px;align-items:start}\n.fail-list{margin-top:48px;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}\n.fail{padding:32px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:60px 1fr;gap:32px;align-items:start}\n.fail-num{font:300 32px/1 var(--serif);color:var(--sig);font-style:italic;padding-top:2px}\n.fail-t{font:500 22px/1.3 var(--serif);color:var(--head);margin-bottom:8px}\n.fail-b{font:400 15px/1.65 var(--sans);color:var(--body);max-width:540px;font-weight:300}\n\n/* ═══ STAT-AS-ART ═══ */\n.big-stat{padding:80px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;margin:80px 0}\n.big-stat-v{font:300 clamp(80px,12vw,160px)/1 var(--serif);color:var(--sig);letter-spacing:-.03em;font-style:italic}\n.big-stat-l{font:400 18px/1.6 var(--sans);color:var(--muted);max-width:560px;margin:24px auto 0;font-weight:300}\n\n/* ═══ TECHNOLOGY ═══ */\n.layer-list{display:flex;flex-direction:column;margin-top:48px}\n.layer{padding:48px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:180px 1fr 1fr;gap:48px;align-items:start;position:relative}\n.layer:last-child{border-bottom:1px solid var(--line)}\n.layer.core{background:linear-gradient(90deg,var(--sigbg) 0%,transparent 40%);padding-left:24px;margin-left:-24px;border-left:2px solid var(--sig)}\n.layer-meta{display:flex;flex-direction:column;gap:8px}\n.layer-num{font:300 28px/1 var(--serif);color:var(--sig);font-style:italic}\n.layer-label{font:500 11px/1.4 var(--mono);color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}\n.layer-label.c{color:var(--sig)}\n.layer-title{font:500 26px/1.2 var(--serif);color:var(--head);margin-bottom:14px}\n.layer-body{font:400 15px/1.7 var(--sans);color:var(--body);font-weight:300}\n.layer-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}\n.tag{font:500 10px/1 var(--mono);padding:5px 9px;border:1px solid var(--line);border-radius:3px;color:var(--muted);letter-spacing:.3px}\n.layer.core .tag{border-color:var(--sigb);color:var(--sig)}\n\n/* ═══ SCENARIO DEMO ═══ */\n.demo-wrap{position:relative;background:var(--ink);overflow:hidden;display:flex}\n#sc-viewport{position:relative;height:720px;flex:1;min-width:0}\n#sc-map{position:absolute;inset:0}\n\n/* Top bar: steps + mode toggle */\n.sc-top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:16px 22px 32px;opacity:0;transition:opacity .4s;background:linear-gradient(180deg,rgba(1,9,18,.94) 0%,rgba(1,9,18,.78) 52%,transparent 100%)}\n.sc-top.show{opacity:1}\n.sc-steps{display:flex;gap:6px}\n.sc-step-dot{width:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.13);cursor:pointer;transition:all .25s}\n.sc-step-dot.active{width:32px;background:var(--sig)}\n.sc-step-dot.done{background:var(--sigb)}\n.sc-step-dot:hover{background:rgba(0,229,196,.4)}\n/* Labeled click-through stepper */\n.sc-steps{display:flex;gap:8px;flex-wrap:wrap}\n.sc-chip{display:flex;align-items:center;gap:9px;background:rgba(1,9,18,.85);border:1px solid var(--line2);border-radius:6px;padding:8px 13px;cursor:pointer;backdrop-filter:blur(12px);transition:all .18s}\n.sc-chip-n{font:700 9px/1 var(--mono);letter-spacing:1px;color:var(--dim)}\n.sc-chip-t{font:600 10px/1 var(--mono);letter-spacing:.5px;color:var(--muted);text-transform:uppercase;white-space:nowrap}\n.sc-chip:hover{border-color:var(--sigb)}\n.sc-chip:hover .sc-chip-t{color:var(--head)}\n.sc-chip.active{background:var(--sig);border-color:var(--sig)}\n.sc-chip.active .sc-chip-n,.sc-chip.active .sc-chip-t{color:var(--ink)}\n.sc-chip.done{border-color:var(--sigb);background:rgba(0,229,196,.07)}\n.sc-chip.done .sc-chip-n{color:var(--sig)}\n.sc-chip.done .sc-chip-t{color:var(--body)}\n/* Analytical breakdown (below map) */\n.sc-breakdown{flex:0 0 380px;align-self:stretch;background:rgba(1,9,18,.55);border-left:1px solid var(--line);padding:22px 22px 28px;overflow-y:auto}\n.scb-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}\n.scb-l{font:700 11px/1 var(--mono);letter-spacing:3px;color:var(--sig);text-transform:uppercase;display:flex;align-items:center;gap:10px}\n.scb-l::before{content:'';width:16px;height:1px;background:var(--sig)}\n.scb-step{font:500 11px/1 var(--mono);letter-spacing:1.5px;color:var(--muted)}\n.scb-body{display:flex;flex-direction:column;gap:22px;padding-top:22px}\n.scb-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}\n.scb-metric{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:13px 15px}\n.scb-metric-l{font:600 8.5px/1.2 var(--mono);letter-spacing:1.2px;color:var(--dim);text-transform:uppercase;margin-bottom:7px}\n.scb-metric-v{font:600 17px/1.15 var(--sans)}\n.scb-analysis-l{font:600 9px/1 var(--mono);letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}\n.scb-analysis-b{font:300 15.5px/1.65 var(--sans);color:var(--body)}\n.scb-analysis-b em{font-style:italic;color:var(--sig);font-weight:400}\n@media(max-width:760px){.scb-body{grid-template-columns:1fr;gap:22px}}\n/* Prominent stepper above the map */\n.sc-stepper-wrap{max-width:1100px;margin:0 auto;padding:4px clamp(24px,5vw,80px) 30px}\n.sc-stepper-hint{flex-basis:100%;font:600 9.5px/1 var(--mono);letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin:0}\n.sc-stepper-hint-dot{width:7px;height:7px;border-radius:50%;background:var(--sig);box-shadow:0 0 10px var(--sig);animation:pulse 2s infinite}\n.sc-stepper{flex:1;min-width:0;display:flex;align-items:flex-start}\n.sc-stepb{flex:1;display:flex;flex-direction:column;align-items:center;gap:11px;cursor:pointer;position:relative;padding:0 4px;background:none;border:none;font-family:inherit}\n.sc-stepb::before{content:'';position:absolute;top:16px;right:50%;width:100%;height:2px;background:var(--line2);z-index:0;transition:background .3s}\n.sc-stepb:first-child::before{display:none}\n.sc-stepb.done::before,.sc-stepb.active::before{background:var(--sig)}\n.sc-stepb-num{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);background:var(--ink);display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--mono);color:var(--muted);transition:all .2s}\n.sc-stepb.active .sc-stepb-num{border-color:var(--sig);background:var(--sig);color:var(--ink);box-shadow:0 0 0 5px rgba(0,229,196,.16)}\n.sc-stepb.done .sc-stepb-num{border-color:var(--sig);color:var(--sig)}\n.sc-stepb-t{font:600 10.5px/1.35 var(--mono);letter-spacing:.4px;color:var(--muted);text-transform:uppercase;text-align:center;max-width:130px;transition:color .2s}\n.sc-stepb.active .sc-stepb-t{color:var(--head)}\n.sc-stepb:hover .sc-stepb-num{border-color:var(--sig);color:var(--head)}\n.sc-stepb.active:hover .sc-stepb-num{color:var(--ink)}\n.sc-stepb:hover .sc-stepb-t{color:var(--head)}\n#sc-steps{display:none}\n@media(max-width:760px){\n  .sc-stepper{flex-wrap:wrap;gap:14px 18px;justify-content:flex-start}\n  .sc-stepb{flex:0 0 auto;flex-direction:row;gap:9px;padding:0}\n  .sc-stepb::before{display:none}\n  .sc-stepb-t{max-width:none;text-align:left}\n}\n@media(max-width:920px){\n  .demo-wrap{flex-direction:column}\n  .sc-breakdown{flex:1 1 auto;align-self:auto;border-left:none;border-top:1px solid var(--line)}\n  #sc-viewport{height:520px}\n}\n.sc-mode{display:flex;background:rgba(1,9,18,.85);border:1px solid var(--line2);border-radius:5px;padding:3px;backdrop-filter:blur(12px)}\n.sc-mb{font:500 9px/1 var(--mono);letter-spacing:1.5px;padding:6px 12px;color:var(--muted);background:transparent;border:none;cursor:pointer;border-radius:3px;text-transform:uppercase;transition:all .15s}\n.sc-mb.on{background:var(--sig);color:var(--ink);font-weight:700}\n.sc-mb:hover:not(.on){color:var(--head)}\n\n/* Right telemetry */\n.sc-stats{position:absolute;top:64px;right:24px;z-index:20;\n  background:rgba(1,9,18,.92);border:1px solid var(--line2);border-radius:6px;\n  padding:16px 20px;backdrop-filter:blur(16px);font-family:var(--mono);\n  opacity:0;transition:opacity .5s;min-width:260px;max-width:300px}\n.sc-stats .sl{font-size:9px;letter-spacing:2.5px;color:var(--muted);margin-bottom:12px;text-transform:uppercase}\n.sc-tel{display:flex;flex-direction:column;gap:6px}\n.sc-tel-row{display:flex;justify-content:space-between;gap:16px;font-size:10px}\n.sc-tel-row span:first-child{color:var(--dim)}\n\n/* Bottom card: narration + analysis + nav */\n.sc-bottom{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:0 24px 24px;\n  opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s}\n.sc-bottom.show{opacity:1;transform:none}\n.sc-card{max-width:920px;margin:0 auto;\n  background:rgba(1,9,18,.96);border:1px solid var(--sigb);border-radius:8px;\n  backdrop-filter:blur(20px);\n  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 60px rgba(0,229,196,.06);\n  overflow:hidden}\n.sc-card-narr{padding:18px 24px 14px;font:400 15px/1.6 var(--sans);color:var(--head);font-weight:300;border-bottom:1px solid var(--line)}\n.sc-card-narr .sc-step{font:600 9px/1 var(--mono);letter-spacing:2.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase}\n.sc-card-narr b{color:var(--sig);font-weight:600}\n.sc-card-narr .sc-warn{color:var(--red);font-weight:600}\n.sc-card-narr .sc-amb{color:var(--amb);font-weight:600}\n\n.sc-card-inv{padding:14px 24px 16px;background:rgba(0,229,196,.025);border-bottom:1px solid var(--line)}\n.sc-inv-l{font:600 9px/1 var(--mono);letter-spacing:2.5px;color:var(--sig);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}\n.sc-inv-l::before{content:'';width:14px;height:1px;background:var(--sig)}\n.sc-inv-b{font:400 14px/1.65 var(--sans);color:var(--body);font-weight:300}\n.sc-inv-b em{font-style:italic;color:var(--sig);font-weight:400}\n\n.sc-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:rgba(1,9,18,.6)}\n.sc-nav-btn{font:600 10px/1 var(--mono);letter-spacing:1.5px;padding:8px 14px;color:var(--muted);background:transparent;border:1px solid var(--line2);border-radius:4px;cursor:pointer;text-transform:uppercase;transition:all .15s}\n.sc-nav-btn:hover:not(:disabled){color:var(--head);border-color:var(--line2)}\n.sc-nav-btn:disabled{opacity:.3;cursor:not-allowed}\n.sc-nav-btn.sc-nav-primary{background:var(--sig);color:var(--ink);border-color:var(--sig);font-weight:700}\n.sc-nav-btn.sc-nav-primary:hover:not(:disabled){background:var(--sig2)}\n.sc-nav-step{font:500 11px/1 var(--mono);letter-spacing:1.5px;color:var(--muted)}\n\n/* ═══ SPY ANIMATIONS ═══ */\n@keyframes sc-radar-sweep{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}\n@keyframes sc-scan-line{0%{transform:translateX(-100%);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(100%);opacity:0}}\n@keyframes sc-glitch{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}}\n@keyframes sc-reticle-lock{0%{transform:translate(-50%,-50%) scale(2);opacity:0}50%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}\n@keyframes sc-reticle-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,69,56,.5),inset 0 0 0 0 rgba(255,69,56,.3)}50%{box-shadow:0 0 0 8px rgba(255,69,56,0),inset 0 0 0 1px rgba(255,69,56,.8)}}\n@keyframes sc-pulse-wave{0%{transform:scale(1);opacity:.6}100%{transform:scale(4);opacity:0}}\n@keyframes sc-digit-scan{0%,100%{opacity:1}50%{opacity:.6}}\n\n.sc-scan-overlay{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .3s}\n.sc-scan-overlay.show{opacity:1}\n.sc-scan-overlay::before{content:'';position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(0,229,196,.18),transparent);animation:sc-scan-line 1.4s ease-out}\n\n.sc-reticle{position:absolute;width:80px;height:80px;z-index:14;pointer-events:none;animation:sc-reticle-lock .5s cubic-bezier(.16,1,.3,1) both;will-change:transform}\n.sc-reticle::before,.sc-reticle::after{content:'';position:absolute;background:var(--red);box-shadow:0 0 6px var(--red)}\n.sc-reticle::before{left:50%;top:0;bottom:0;width:1px;margin-left:-.5px}\n.sc-reticle::after{top:50%;left:0;right:0;height:1px;margin-top:-.5px}\n.sc-reticle .rcorn{position:absolute;width:14px;height:14px;border:1.5px solid var(--red);box-shadow:0 0 8px rgba(255,69,56,.5)}\n.sc-reticle .rcorn.tl{top:0;left:0;border-right:none;border-bottom:none}\n.sc-reticle .rcorn.tr{top:0;right:0;border-left:none;border-bottom:none}\n.sc-reticle .rcorn.bl{bottom:0;left:0;border-right:none;border-top:none}\n.sc-reticle .rcorn.br{bottom:0;right:0;border-left:none;border-top:none}\n.sc-reticle .rdot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border:1px solid var(--red);border-radius:50%;animation:sc-reticle-pulse 1.4s ease-in-out infinite}\n.sc-reticle.teal::before,.sc-reticle.teal::after{background:var(--sig);box-shadow:0 0 6px var(--sig)}\n.sc-reticle.teal .rcorn{border-color:var(--sig);box-shadow:0 0 8px rgba(0,229,196,.5)}\n.sc-reticle.teal .rdot{border-color:var(--sig);animation:sc-reticle-pulse-teal 1.4s ease-in-out infinite}\n@keyframes sc-reticle-pulse-teal{0%,100%{box-shadow:0 0 0 0 rgba(0,229,196,.5),inset 0 0 0 0 rgba(0,229,196,.3)}50%{box-shadow:0 0 0 10px rgba(0,229,196,0),inset 0 0 0 1px rgba(0,229,196,.8)}}\n\n.sc-glitch{position:relative;display:inline-block;animation:sc-glitch .25s steps(2,end) 2}\n.sc-glitch::before,.sc-glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;mix-blend-mode:screen}\n.sc-glitch::before{color:var(--red);transform:translate(-1.5px,0);clip-path:inset(0 0 60% 0)}\n.sc-glitch::after{color:var(--sig);transform:translate(1.5px,0);clip-path:inset(40% 0 0 0)}\n\n.sc-pulse-wave{position:absolute;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--sig);pointer-events:none;z-index:13;animation:sc-pulse-wave 1.8s ease-out infinite}\n.sc-pulse-wave.red{border-color:var(--red);animation-duration:1.4s}\n\n/* Animated coordinate scanning */\n.sc-tel-row .scan{display:inline-block;animation:sc-digit-scan .12s steps(2) 8;font-feature-settings:'tnum'}\n\n/* Map scan-line aesthetic */\n#sc-viewport::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;\n  background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,229,196,.018) 3px,rgba(0,229,196,.018) 3px)}\n.sc-play-overlay{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;\n  background:rgba(1,9,18,.55);cursor:pointer;transition:opacity .4s;backdrop-filter:blur(2px)}\n.sc-play-overlay.hide{opacity:0;pointer-events:none}\n.sc-play-btn{display:flex;flex-direction:column;align-items:center;gap:14px}\n.sc-play-circle{width:72px;height:72px;border-radius:50%;border:2px solid rgba(0,229,196,.4);\n  display:flex;align-items:center;justify-content:center;background:rgba(0,229,196,.06);\n  box-shadow:0 0 40px rgba(0,229,196,.1);transition:all .2s}\n.sc-play-circle:hover{background:rgba(0,229,196,.12);box-shadow:0 0 60px rgba(0,229,196,.15)}\n.sc-play-tri{width:0;height:0;border-left:20px solid var(--sig);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}\n.sc-play-label{font:500 11px/1 var(--mono);letter-spacing:3px;color:var(--sig);text-transform:uppercase}\n.sc-play-sub{font:400 11px/1.3 var(--sans);color:var(--muted);font-weight:300;margin-top:-4px}\n\n/* ═══ MARKET ═══ */\n.market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:64px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.market-tier{padding:40px 32px;border-right:1px solid var(--line)}\n.market-tier:last-child{border-right:none}\n.market-tier.focus{background:var(--sigbg);border-top:2px solid var(--sig);margin-top:-1px}\n.mt-label{font:500 10px/1 var(--mono);color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}\n.market-tier.focus .mt-label{color:var(--sig)}\n.mt-v{font:300 56px/1 var(--serif);color:var(--head);letter-spacing:-.02em;margin-bottom:8px}\n.market-tier.focus .mt-v{color:var(--sig)}\n.mt-name{font:500 14px/1.4 var(--sans);color:var(--head);margin-bottom:14px}\n.mt-desc{font:400 14px/1.65 var(--sans);color:var(--muted);font-weight:300;margin-bottom:20px}\n.mt-items{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}\n.mt-item{font:400 12px/1.5 var(--mono);color:var(--dim)}\n\n/* ═══ SOLUTION / DIFFERENTIATORS ═══ */\n.pull-quote{padding:80px 0;text-align:center;max-width:920px;margin:0 auto}\n.pq-text{font:300 italic clamp(28px,3.6vw,48px)/1.3 var(--serif);color:var(--head);letter-spacing:-.01em}\n.pq-text::before,.pq-text::after{content:'\"';color:var(--sig);font-style:normal;opacity:.5}\n.pq-attr{font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:2px;margin-top:32px;text-transform:uppercase}\n\n.diff-list{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:48px;border-top:1px solid var(--line)}\n.diff{padding:36px 24px 36px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}\n.diff:last-child{border-right:none}\n.diff-num{font:300 14px/1 var(--mono);color:var(--sig);letter-spacing:2px;margin-bottom:14px}\n.diff-t{font:500 22px/1.25 var(--serif);color:var(--head);margin-bottom:10px;letter-spacing:-.01em}\n.diff-b{font:400 14px/1.65 var(--sans);color:var(--muted);font-weight:300}\n\n/* ═══ COMPETITIVE MATRIX ═══ */\n.comp-table{width:100%;margin-top:48px;border-collapse:separate;border-spacing:0}\n.comp-table th,.comp-table td{padding:18px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}\n.comp-table th{font:500 10px/1 var(--mono);color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding-to
