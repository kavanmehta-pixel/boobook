document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eed-item.med{border-left-color:var(--amb)}\n.feed-item.low{border-left-color:var(--grn)}\n.feed-time{font-size:9px;color:var(--muted);letter-spacing:.5px;margin-bottom:2px}\n.feed-msg{font-size:10px;color:var(--body);line-height:1.4;font-family:var(--sans);font-weight:400}\n.feed-msg b{color:var(--head);font-weight:600}\n.feed-msg .r{color:var(--red)}\n.feed-msg .a{color:var(--amb)}\n.feed-msg .g{color:var(--sig)}\n\n/* Right panel hides its header chrome entirely when empty */\n#rp.empty .ph{display:none}\n\n/* Bottom panel as tabs */\n.bp-tabs{display:flex;border-bottom:1px solid var(--e1);flex-shrink:0}\n.bp-tab{padding:10px 18px;font:600 10px/1 var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;display:flex;align-items:center;gap:8px}\n.bp-tab:hover{color:var(--body)}\n.bp-tab.on{color:var(--sig);border-bottom-color:var(--sig)}\n.bp-tab-c{font-size:9px;padding:2px 7px;border-radius:3px;background:rgba(255,255,255,.04);color:var(--muted)}\n.bp-tab.on .bp-tab-c{background:var(--sigbg);color:var(--sig)}\n.bp-view{flex:1;display:none;overflow:hidden;flex-direction:column;min-height:0}\n.bp-view.on{display:flex}\n.bp-tile{background:var(--bg);padding:10px 14px;display:flex;flex-direction:column;overflow:hidden}\n.bp-tile-l{font:600 9px/1 var(--mono);letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}\n.bp-tile-canvas{flex:1;position:relative;min-height:0}\n.bp-mid-content{display:flex;flex-direction:row;height:100%;min-height:0;overflow-x:auto;overflow-y:hidden}\n.bp-mid-content>.bp-tile{flex:0 0 230px;min-width:230px}\n.bp-mid-content .bp-tile{border-right:1px solid var(--e1)}\n.bp-mid-content .bp-tile:last-child{border-right:none}\n.bp-tile-foot{font:400 9px/1 var(--mono);color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}\n\n/* Asset list (right of bottom) */\n.assets{overflow-y:auto;flex:1;padding:8px 0}\n.asset-item{padding:9px 14px;border-bottom:1px solid var(--e1);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .12s}\n.asset-item:hover{background:rgba(255,255,255,.015)}\n.asset-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}\n.asset-dot.av{background:var(--grn);color:var(--grn)}\n.asset-dot.brief{background:var(--amb);color:var(--amb)}\n.asset-dot.unavail{background:var(--red);color:var(--red)}\n.asset-name{font:500 11px/1.3 var(--sans);color:var(--head);flex:1}\n.asset-meta{font:400 9px/1.3 var(--mono);color:var(--muted);text-align:right}\n\n/* \u2550\u2550\u2550 MAP CONTROLS \u2550\u2550\u2550 */\n#map-ctrls{position:fixed;top:64px;left:356px;z-index:100;display:flex;gap:5px;padding:8px;flex-wrap:wrap}\n.mc{font:600 9px/1 var(--mono);padding:5px 11px;border-radius:5px;border:1px solid var(--e2);color:var(--muted);cursor:pointer;background:rgba(2,12,24,.8);backdrop-filter:blur(12px);transition:all .12s;display:flex;align-items:center;gap:6px;letter-spacing:.5px;text-transform:uppercase}\n.mc:hover{color:var(--body);border-color:var(--e3)}\n.mc.on{color:var(--sig);border-color:var(--sigb);background:rgba(0,229,196,.05)}\n.mc .d{width:6px;height:6px;border-radius:50%}\n#map-zoom{position:fixed;bottom:232px;left:364px;z-index:100;display:flex;flex-direction:column;gap:1px}\n.mz{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:rgba(2,12,24,.85);border:1px solid var(--e2);color:var(--muted);cursor:pointer;font:500 15px/1 var(--mono);transition:all .12s;backdrop-filter:blur(12px)}\n.mz:first-child{border-radius:6px 6px 0 0}.mz:last-child{border-radius:0 0 6px 6px}\n.mz:hover{color:var(--head);background:rgba(7,24,38,.95)}\n\n/* \u2550\u2550\u2550 SCROLLBARS \u2550\u2550\u2550 */\n::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--e2);border-radius:2px}::-webkit-scrollbar-thumb:hover{ iv class=\"d\" style=\"background:var(--purple)\"><\/div>Density<\/button>\n  <button class=\"mc\" id=\"mc-zones\" onclick=\"togL('zones')\"><div class=\"d\" style=\"background:var(--blue)\"><\/div>Zones<\/button>\n  <button class=\"mc on\" id=\"mc-grid\" onclick=\"togL('grid')\"><div class=\"d\" style=\"background:var(--sig);opacity:.2\"><\/div>Grid<\/button>\n  <div style=\"margin-top:8px;padding-top:7px;border-top:1px solid var(--e1);font:400 8px/1.4 var(--mono);color:var(--muted);letter-spacing:.3px;max-width:150px\"><span style=\"color:#f59e0b\">\u25c6 RF<\/span> simulation calibrated to live AIS \u00b7 pilot-ready<\/div>\n<\/div>\n<div id=\"map-zoom\"><button class=\"mz\" onclick=\"map.zoomIn()\">+<\/button><button class=\"mz\" onclick=\"map.zoomOut()\">\u2212<\/button><\/div>\n\n<!-- LEFT PANEL -->\n<div class=\"panel\" id=\"lp\">\n  <div class=\"itabs\">\n    <div class=\"it on\" id=\"it-alerts\" onclick=\"switchTab('alerts')\">Alerts<\/div>\n    <div class=\"it\" id=\"it-vessels\" onclick=\"switchTab('vessels')\">Vessels<\/div>\n  <\/div>\n  <div id=\"v-alerts\" style=\"display:flex;flex-direction:column;flex:1;overflow:hidden\">\n    <div class=\"ph\"><span class=\"ph-t\"><span class=\"ph-dot\"><\/span>Alert Queue<\/span><span class=\"ph-c\" id=\"aq-c\">\u2014<\/span><\/div>\n    <div class=\"fs\" id=\"fs\"><\/div>\n    <div class=\"al\" id=\"al\"><\/div>\n  <\/div>\n  <div id=\"v-vessels\" style=\"display:none;flex-direction:column;flex:1;overflow:hidden\">\n    <div class=\"ph\"><span class=\"ph-t\"><span class=\"ph-dot\"><\/span>Vessel Register<\/span><span class=\"ph-c\" id=\"vc-count\">\u2014<\/span><\/div>\n    <div class=\"vl\" id=\"vl\"><\/div>\n  <\/div>\n<\/div>\n\n<!-- RIGHT PANEL -->\n<div class=\"panel collapsed\" id=\"rp\">\n  <div class=\"rp-collapsed-tab\" onclick=\"toggleRP()\"><span class=\"rpct-arrow\">\u25c0<\/span> Intelligence Report<\/div>\n  <div class=\"ph\">\n    <span class=\"ph-t\" id=\"rp-t\"><span class=\"ph-dot\"><\/span>Intelligence Report<\/span>\n    <div style=\"display:flex;align-items:center;gap:8px\">\n      <span class=\"ph-c\" id=\"rp-id\"><\/span>\n      <button class=\"ph-close\" id=\"rp-close\" onclick=\"collapseRP()\" title=\"Hide panel \u2014 reopen from the side tab or by selecting a vessel\">\u00d7<\/button>\n    <\/div>\n  <\/div>\n  <div id=\"de\" class=\"de\">\n    <div class=\"de-ring\">\u25ce<\/div>\n    <div class=\"de-t\">No Selection<\/div>\n    <div class=\"de-s\">Click any vessel or alert to open the full intelligence report \u2014 track analysis, comms, alerts, tasking<\/div>\n  <\/div>\n  <div id=\"ds\" style=\"display:none;flex-direction:column;flex:1;overflow:hidden\"><\/div>\n<\/div>\n\n<!-- BOTTOM PANEL -->\n<div class=\"panel collapsed\" id=\"bp\">\n  <div class=\"bp-tabs\" id=\"bp-tabs\">\n    <div class=\"bp-tab on\" data-bpt=\"feed\" onclick=\"openBpTab('feed')\">Activity Feed <span class=\"bp-tab-c\" id=\"bpt-feed-c\">\u2014<\/span><\/div>\n    <div class=\"bp-tab\" data-bpt=\"analytics\" onclick=\"openBpTab('analytics')\">Analytics<\/div>\n    <div class=\"bp-tab\" data-bpt=\"assets\" onclick=\"openBpTab('assets')\">Patrol Assets <span class=\"bp-tab-c\" id=\"bpt-assets-c\">5<\/span><\/div>\n    <button class=\"ph-min\" style=\"margin:auto 12px auto auto\" onclick=\"toggleBP(event)\" title=\"Minimise\" id=\"bp-min\">\u2013<\/button>\n  <\/div>\n  <div class=\"bp-view on\" id=\"bpv-feed\">\n    <div class=\"feed\" id=\"feed\"><\/div>\n  <\/div>\n  <div class=\"bp-view\" id=\"bpv-analytics\">\n    <div class=\"bp-mid-content\" id=\"bp-mid-content\"><\/div>\n  <\/div>\n  <div class=\"bp-view\" id=\"bpv-assets\">\n    <div class=\"assets\" id=\"assets\"><\/div>\n  <\/div>\n<\/div>\n\n<script src=\"6c368825-ecf3-448f-b12a-b3c27e3c03c2\"><\/script>\n<script>\n// \u2550\u2550\u2550 CONSTANTS \u2550\u2550\u2550\nconst TL={AIS_GAP:'AIS Gap',IMPOSSIBLE_SPEED:'Impossible Speed',LOITERING:'Loitering',RENDEZVOUS_CANDIDATE:'Rendezvous',SENSITIVE_ZONE:'Sensitive Zone'};\nconst RCC=s=>s>=80?'#ff4538':s>=55?'#f59e0b':'#00e5c4';\nconst SENSORS=[[-10.58,142.22,'TS-\u03b1','TS Alpha \u00b7 Thursday Is','P3'],[-10.85,142.65,'TS-\u03b2','TS Beta \u00b7 Prince of Wales','P3'],[-9.38,142.62,'TS-\u03b3','TS Gamma \u00b7 Saibai Is','P3'],[-12.45,130.84,'DAR','Darwin Harbour','P3'],[-11.72,136.5,'ARA','Arafura East \u00b7 Croker Is','P4'],[-14.93,128.12,'JBG','Joseph Bonaparte Gulf','P4'],[-13.85,136.42,'GCN','Gulf Carpentaria N','P4']];\nconst ASSETS=[\n  {id:'ACV-OCEAN-SHIELD',name:'ACV Ocean Shield',type:'Cape-class patrol',status:'av',pos:[-10.6,142.2],eta:'12 min'},\n  {id:'HMAS-MELVILLE',name:'HMAS Melville',type:'Hydrographic survey',status:'av',pos:[-12.4,130.8],eta:'45 min'},\n  {id:'CG-12',name:'Coastguard CG-12',type:'RHIB \u00b7 8m',status:'brief',pos:[-10.5,142.4],eta:'8 min \u00b7 briefing'},\n  {id:'AIR-AWAC',name:'P-8A Poseidon',type:'MPA \u00b7 airborne',status:'av',pos:[-11.2,135.5],eta:'22 min \u00b7 transit'},\n  {id:'CG-04',name:'Coastguard CG-04',type:'RHIB \u00b7 8m',status:'unavail',pos:[-11.5,143.0],eta:'maintenance'},\n];\nconst CHANNELS=[\n  {name:'AIS-A',freq:'161.975 MHz',label:'AIS Channel A'},\n  {name:'AIS-B',freq:'162.025 MHz',label:'AIS Channel B'},\n  {name:'VHF 16',freq:'156.800 MHz',label:'Distress / Safety'},\n  {name:'VHF 70',freq:'156.525 MHz',label:'DSC'},\n  {name:'VHF 13',freq:'156.650 MHz',label:'Bridge-to-bridge'},\n];\nconst LY={tracks:true,alerts:true,sensors:true,assets:true,heatmap:false,zones:false,grid:true,rf:true};\n\n// \u2550\u2550\u2550 STATE \u2550\u2550\u2550\nconst S={id:'live',inner:'alerts',detailTab:'overview',sevF:new Set(['HIGH','MEDIUM','LOW']),typeF:null,fusF:null,selA:null,selV:null,\n  TL:{},DL:{},AR:[],SL:[],GL:[],HL:[],GM:[],ASL:[],ZL:[],FZ:{},RFL:[]};\n\n// \u2550\u2550\u2550 ANALYTICS HELPERS \u2550\u2550\u2550\nfunction parseGapHours(evidence){const m=evidence?.match(/([\\d.]+)\\s*h\\s*(silence|gap)/i);return m?parseFloat(m[1]):null}\nfunction haversineKm(a,b){const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}\n\n// \u2550\u2550\u2550 RF\u00d7AIS FUSION ENGINE (Stage 1) \u2550\u2550\u2550\nconst RF_RANGE_KM=220;\nfunction _sensorsCovering(lat,lon){let n=0;for(const s of SENSORS){if(haversineKm([lat,lon],[s[0],s[1]])<=RF_RANGE_KM)n++;}return n;}\nfunction _geoQuality(n){if(n>=3)return{fix:true,maj:0.6,min:0.4,conf:0.93};if(n===2)return{fix:true,maj:2.4,min:0.7,conf:0.74};if(n===1)return{fix:true,maj:6.0,min:4.0,conf:0.45};return{fix:false,maj:null,min:null,conf:0};}\nfunction buildFusion(dsId){\n  const ds=DS[dsId];if(!ds)return{};\n  const tracks={};(ds.tracks&&ds.tracks.features||[]).forEach(t=>{tracks[String(t.properties.mmsi)]=t;});\n  const abm={};(ds.alerts||[]).forEach(a=>{const k=String(a.mmsi);(abm[k]=abm[k]||[]).push(a);});\n  const out={};\n  (ds.vessels_list||[]).forEach(v=>{\n    const mmsi=String(v.mmsi);const tr=tracks[mmsi];const af=abm[mmsi]||[];\n    const atypes=new Set(af.map(a=>a.alert_type));\n    const coords=(tr&&tr.geometry&&tr.geometry.coordinates)||[];\n    let covered=false,sum=0,cnt=0,maxN=0;const rfPts=[];\n    if(coords.length){\n      const step=Math.max(1,Math.floor(coords.length/40));\n      for(let i=0;i<coords.length;i+=step){\n        const lon=coords[i][0],lat=coords[i][1];const n=_sensorsCovering(lat,lon);\n        if(n>0)covered=true;sum+=n;cnt++;if(n>maxN)maxN=n;\n        rfPts.push({lat,lon,sensors:n});\n      }\n    }\n    const avg=cnt?sum/cnt:0;\n    const hasSpoof=atypes.has('IMPOSSIBLE_SPEED');\n    const hasGap=atypes.has('AIS_GAP');\n    let state;\n    if(hasSpoof&&covered)state='GHOST';\n    else if(hasGap&&covered)state='DARK';\n    else if(covered)state='CONFIRMED';\n    else state='CLEAR';\n    const gq=_geoQuality(maxN);\n    out[mmsi]={state,avgSensors:Math.round(avg*10)/10,maxSensors:maxN,rfConfidence:gq.conf,ellipse:[gq.maj,gq.min],covered,rfPts,hasGap,hasSpoof};\n  });\n  return out;\n}\nfunction fusionCounts(fz){const c={CONFIRMED:0,DARK:0,GHOST:0,CLEAR:0};Object.values(fz).forEach(f=>{c[f.state]++;});return c;}\n\n// Fusion verdict metadata (color, label, one-line meaning)\nfunction _fusionMeta(state){\n  return ({\n    CONFIRMED:{c:'#00e5c4',label:'CONFIRMED',sub:'AIS + RF agree \u2014 position validated by both sources'},\n    DARK:{c:'#f59e0b',label:'DARK CONTACT',sub:'AIS silent, RF active \u2014 vessel emitting but not reporting'},\n    GHOST:{c:'#a855f7',label:'GHOST / SPOOF',sub:'AIS position contradicted by RF \u2014 likely spoofed broadcast'},\n    CLEAR:{c:'rgba(255,255,255,.5)',label:'CLEAR',sub:'No AIS, no RF \u2014 outside sensor coverage or no contact'}\n  })[state]||{c:'rgba(255,255,255,.5)',label:state,sub:''};\n}\n// Which sensors cover a given lat/lon (for the RF readout)\nfunction _contributingSensors(lat,lon){\n  return SENSORS.filter(s=>haversineKm([lat,lon],[s[0],s[1]])<=RF_RANGE_KM)\n    .map(s=>({code:s[2],name:s[3],km:Math.round(haversineKm([lat,lon],[s[0],s[1]]))}))\n    .sort((a,b)=>a.km-b.km);\n}\n// Emitter inference from fusion state (synthetic but physically grounded)\n\nfunction _vesselProfile(vRec){\n  const nm=((vRec.vessel_name||'')+'').toUpperCase(),vt=((vRec.vessel_type||'')+'').toUpperCase(),mid=String(vRec.mmsi).slice(0,3);\n  if(nm.indexOf('ABFV')>=0||vt.indexOf('LAW_ENFORC')>=0||nm.indexOf('PATROL')>=0)return'enforcement';\n  if(nm.indexOf('LICENSED')>=0)return'licensed';\n  if(['525','510','553'].indexOf(mid)>=0&&vt.indexOf('FISH')>=0)return'foreign_fishing';\n  if(vt===''||vt==='UNKNOWN')return'unknown';\n  return'other';\n}\nfunction _maxGapHours(va){let mx=null;(va||[]).forEach(a=>{if(a.alert_type==='AIS_GAP'){const g=parseGapHours(a.evidence);if(g!==null&&(mx===null||g>mx))mx=g;}});return mx;}\n// Transparent additive threat model \u2014 every point line-item explainable.\nfunction riskModel(vRec,va){\n  const fu=S.FZ[String(vRec.mmsi)]||{state:'CLEAR',maxSensors:0,rfConfidence:0};\n  const at=new Set((va||[]).map(a=>a.alert_type));\n  const F=[];const gap=_maxGapHours(va);const state=fu.state,maxN=fu.maxSensors,repeats=(va||[]).length;\n  const prof=_vesselProfile(vRec);const hasAnomaly=at.size>0;\n  // AIS analytics\n  if(gap!==null){\n    if(gap>24)F.push(['AIS silence >24h ('+gap.toFixed(0)+'h)',24,'ais']);\n    else if(gap>2)F.push(['AIS silence '+gap.toFixed(0)+'h',18,'ais']);\n    else if(gap>1)F.push(['AIS silence '+gap.toFixed(0)+'h',13,'ais']);\n    else if(gap>0.5)F.push(['AIS silence '+Math.round(gap*60)+'m',8,'ais']);\n    else F.push(['AIS silence brief',3,'ais']);\n  }\n  if(at.has('IMPOSSIBLE_SPEED'))F.push(['Impossible-speed / spoof signature',22,'ais']);\n  if(at.has('LOITERING'))F.push(['Loitering pattern',15,'ais']);\n  if(at.has('RENDEZVOUS_CANDIDATE'))F.push(['Rendezvous candidate',18,'ais']);\n  if(at.has('SENSITIVE_ZONE'))F.push(['Sensitive-zone breach',16,'ais']);\n  // RF fusion\n  if(state==='DARK')F.push(['RF re-acquired during AIS silence',34,'rf']);\n  else if(state==='GHOST')F.push(['RF position contradicts AIS report',28,'rf']);\n  if(maxN>=3)F.push(['3+ sensor TDOA fix (high confidence)',8,'rf']);\n  else if(maxN===1)F.push(['Single-station fix (weak geometry)',-6,'rf']);\n  // Context\n  if(hasAnomaly&&prof==='foreign_fishing')F.push(['Foreign-flag fishing in anomaly',10,'ctx']);\n  else if(hasAnomaly&&prof==='unknown')F.push(['Unregistered / unknown type',5,'ctx']);\n  if(repeats>5)F.push(['Repeat offender ('+repeats+' alerts)',10,'ctx']);\n  else if(repeats>=3)F.push(['Repeat activity ('+repeats+' alerts)',6,'ctx']);\n  else if(repeats===2)F.push(['Prior alert history',3,'ctx']);\n  // Mitigations\n  if(prof==='enforcement')F.push(['Known enforcement / patrol asset',-30,'mit']);\n  else if(prof==='licensed')F.push(['Licensed cooperative vessel',-25,'mit']);\n  if(state==='CONFIRMED'&&at.size===0)F.push(['RF confirms identity \u2014 deception ruled out',-8,'mit']);\n  const raw=F.reduce((s,f)=>s+f[1],0);const score=Math.max(0,Math.min(100,raw));\n  const subt={ais:0,rf:0,ctx:0,mit:0};F.forEach(f=>subt[f[2]]+=f[1]);\n  return{score,factors:F,subtotals:subt,confidence:fu.rfConfidence,state};\n}\nfunction _riskTier(s){if(s>=91)return['CRITICAL','#ff4538','Immediate intercept / escalation'];if(s>=76)return['HIGH','#ff4538','Recommend patrol tasking'];if(s>=56)return['ELEVATED','#f59e0b','Cue surveillance'];if(s>=31)return['MODERATE','#f59e0b','Analyst review'];return['LOW','#00e5c4','Monitor'];}\nfunction _emitterProfile(fu){\n  if(!fu.covered)return{type:'\u2014',detail:'No emission detected within coverage'};\n  if(fu.state==='GHOST')return{type:'X-band nav radar',detail:'RF fix conflicts with reported AIS position'};\n  if(fu.state==='DARK')return{type:'X-band nav radar + VSAT',detail:'Vessel underway, transponder dark'};\n  return{type:'AIS 162 MHz + X-band radar',detail:'Cooperative emission, identity self-reported'};\n}\nfunction _fusionBadge(mmsi){const f=S.FZ[String(mmsi)];if(!f)return'';if(f.state==='DARK')return'<span style=\"font:700 7.5px/1 var(--mono);letter-spacing:.5px;color:#f59e0b;border:1px solid rgba(245,158,11,.4);border-radius:2px;padding:2px 4px;margin-left:6px\">RF\\u2713 DARK<\/span>';if(f.state==='GHOST')return'<span style=\"font:700 7.5px/1 var(--mono);letter-spacing:.5px;color:#a855f7;border:1px solid rgba(168,85,247,.4);border-radius:2px;padding:2px 4px;margin-left:6px\">SPOOF<\/span>';return'';}\n\nfunction bearing(a,b){const \u03c61=a[0]*Math.PI/180,\u03c62=b[0]*Math.PI/180,\u0394\u03bb=(b[1]-a[1])*Math.PI/180;const y=Math.sin(\u0394\u03bb)*Math.cos(\u03c62);const x=Math.cos(\u03c61)*Math.sin(\u03c62)-Math.sin(\u03c61)*Math.cos(\u03c62)*Math.cos(\u0394\u03bb);return (Math.atan2(y,x)*180/Math.PI+360)%360}\nfunction compass(b){return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(b/22.5)%16]}\n// Compute track analytics from positions+timestamps (we only have coords, derive from track length and time span)\nfunction computeTrackStats(vessel){\n  const track=DS[S.id].tracks.features.find(f=>String(f.properties.mmsi)===String(vessel.mmsi));\n  if(!track||track.geometry.coordinates.length<2)return null;\n  const coords=track.geometry.coordinates; // [[lon,lat],...]\n  let totalKm=0,maxSeg=0;const segments=[];\n  for(let i=1;i<coords.length;i++){\n    const d=haversineKm([coords[i-1][1],coords[i-1][0]],[coords[i][1],coords[i][0]]);\n    totalKm+=d;maxSeg=Math.max(maxSeg,d);segments.push(d);\n  }\n  // Estimate time span and avg speed\n  const t0=new Date(vessel.first_seen),t1=new Date(vessel.last_seen);\n  const hours=(t1-t0)/3600000;\n  const avgKn=hours>0?(totalKm*0.539957)/hours:0;\n  const lastB=bearing([coords[coords.length-2][1],coords[coords.length-2][0]],[coords[coords.length-1][1],coords[coords.length-1][0]]);\n  return{totalKm,maxSeg,avgKn,hours,heading:Math.round(lastB),compass:compass(lastB),segments};\n}\nfunction getRepeatOffenders(alerts){const c={};alerts.forEach(a=>c[a.mmsi]=(c[a.mmsi]||0)+1);return Object.entries(c).filter(([,n])=>n>1).sort((a,b)=>b[1]-a[1])}\nfunction getVesselTypeBreakdown(alerts){const c={};alerts.forEach(a=>{const t=a.vessel_type||'Unknown';c[t]=(c[t]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])}\nfunction getHourDistribution(alerts){const h=Array(24).fill(0);alerts.forEach(a=>{const ts=a.timestamp;if(ts){const hr=parseInt(ts.slice(11,13));if(!isNaN(hr))h[hr]++}});return h}\nfunction getDailyVolume(alerts){const d={};alerts.forEach(a=>{const day=(a.timestamp||'').slice(0,10);if(day)d[day]=(d[day]||0)+1});return Object.entries(d).sort((a,b)=>a[0].localeCompare(b[0]))}\nfunction getGapDistribution(alerts){const bins=[0,0,0,0,0,0];alerts.filter(a=>a.alert_type==='AIS_GAP').forEach(a=>{const g=parseGapHours(a.evidence);if(g===null)return;if(g<6)bins[0]++;else if(g<12)bins[1]++;else if(g<24)bins[2]++;else if(g<48)bins[3]++;else if(g<168)bins[4]++;else bins[5]++});return bins}\n\n// \u2550\u2550\u2550 MAP \u2550\u2550\u2550\nconst map=L.map('map',{center:[-11.5,138],zoom:6,zoomControl:false,attributionControl:false});\nL.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,errorTileUrl:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}).addTo(map);\n\nmap.on('mousemove',e=>{\n  document.getElementById('cr-lat').textContent=e.latlng.lat.toFixed(4)+'\u00b0';\n  document.getElementById('cr-lon').textContent=e.latlng.lng.toFixed(4)+'\u00b0';\n  document.getElementById('coord-readout').classList.add('show');\n});\nmap.on('mouseout',()=>document.getElementById('coord-readout').classList.remove('show'));\n\nfunction drawGrid(){\n  S.GL.forEach(l=>l.remove());S.GL=[];if(!LY.grid)return;\n  for(let lat=-16;lat<=-6;lat++)S.GL.push(L.polyline([[lat,128],[lat,152]],{color:'rgba(0,229,196,.04)',weight:.5,interactive:false}).addTo(map));\n  for(let lon=128;lon<=152;lon++)S.GL.push(L.polyline([[-16,lon],[-6,lon]],{color:'rgba(0,229,196,.04)',weight:.5,interactive:false}).addTo(map));\n}\nfunction drawSensors(){\n  S.SL.forEach(l=>l.remove());S.SL=[];if(!LY.sensors)return;\n  SENSORS.forEach(([lat,lon,code,name,ph])=>{\n    const html='<div style=\"position:relative;width:16px;height:16px\"><div style=\"position:absolute;inset:0;border-radius:50%;background:rgba(0,229,196,.12);animation:sensor-pulse 3s ease-out infinite\"><\/div><div style=\"position:absolute;inset:4px;border-radius:50%;background:#00e5c4;box-shadow:0 0 12px #00e5c4\"><\/div><\/div>';\n    const m=L.marker([lat,lon],{icon:L.divIcon({html,className:'',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);\n    m.bindPopup('<b style=\"color:#00e5c4\">'+code+' \u00b7 '+name+'<\/b><br>Phase: '+ph+'<br><span style=\"color:rgba(255,255,255,.4)\">VHF 156\u2013174 MHz \u00b7 AIS 162 MHz<\/span>');\n    const c=L.circle([lat,lon],{radius:220000,color:'rgba(0,229,196,.07)',fillColor:'rgba(0,229,196,.015)',fill:true,fillOpacity:1,weight:.5,dashArray:'4 12',interactive:false}).addTo(map);\n    const cInner=L.circle([lat,lon],{radius:45000,color:'rgba(0,229,196,.12)',fill:false,weight:.6,dashArray:'6 10',interactive:false}).addTo(map);\n    S.SL.push(m,c,cInner);\n  });\n}\nfunction _ellipsePoly(lat,lon,majNm,minNm,bearingDeg){\n  // approximate uncertainty ellipse as a polygon (geolocation confidence region)\n  const maj=majNm/60, min=minNm/60; // nm -> deg approx\n  const br=bearingDeg*Math.PI/180, pts=[];\n  for(let a=0;a<360;a+=20){\n    const t=a*Math.PI/180;\n    let ex=maj*Math.cos(t), ey=min*Math.sin(t);\n    const rx=ex*Math.cos(br)-ey*Math.sin(br), ry=ex*Math.sin(br)+ey*Math.cos(br);\n    pts.push([lat+ry, lon+rx/Math.cos(lat*Math.PI/180)]);\n  }\n  return pts;\n}\nfunction drawRF(){\n  S.RFL.forEach(l=>l.remove());S.RFL=[];\n  if(!LY.rf)return;\n  const ds=DS[S.id],fz=S.FZ;\n  (ds.tracks&&ds.tracks.features||[]).forEach(f=>{\n    const mmsi=String(f.properties.mmsi),fu=fz[mmsi];\n    if(!fu||!fu.covered)return;\n    const coords=f.geometry.coordinates; // [lon,lat]\n    if(coords.length<2)return;\n    const isDark=fu.state==='DARK',isGhost=fu.state==='GHOST';\n    // RF detection pulses sampled along the track (amber = RF emission detected)\n    const step=Math.max(1,Math.floor(coords.length/14));\n    for(let i=0;i<coords.length;i+=step){\n      const lat=coords[i][1],lon=coords[i][0];\n      const r=isDark?3.2:isGhost?3.2:2.2;\n      const col=isDark?'#f59e0b':isGhost?'#a855f7':'rgba(245,158,11,.55)';\n      const dot=L.circleMarker([lat,lon],{radius:r,color:'transparent',fillColor:col,fillOpacity:isDark||isGhost?.9:.5,interactive:false}).addTo(map);\n      S.RFL.push(dot);\n    }\n    // For DARK + GHOST: draw the geolocation uncertainty ellipse on the latest RF fix\n    if(isDark||isGhost){\n      const last=coords[coords.length-1];\n      const maj=fu.ellipse[0]||0.6,min=fu.ellipse[1]||0.4;\n      const el=L.polygon(_ellipsePoly(last[1],last[0],maj*8,min*8,40),{\n        color:isGhost?'#a855f7':'#f59e0b',weight:1,opacity:.6,\n        fillColor:isGhost?'#a855f7':'#f59e0b',fillOpacity:.06,dashArray:'3 4',interactive:false}).addTo(map);\n      S.RFL.push(el);\n      // DARK: stitch line from last AIS fix to RF continuation (the \"recovery\")\n      if(isDark){\n        const a=coords[Math.max(0,coords.length-3)],b=last;\n        const stitch=L.polyline([[a[1],a[0]],[b[1],b[0]]],{color:'#f59e0b',weight:1.4,opacity:.5,dashArray:'2 6',interactive:false}).addTo(map);\n        S.RFL.push(stitch);\n      }\n    }\n  });\n}\n\nfunction drawAssets(){\n  S.ASL.forEach(l=>l.remove());S.ASL=[];if(!LY.assets)return;\n  ASSETS.forEach(a=>{\n    const color=a.status==='av'?'#10b981':a.status==='brief'?'#f59e0b':'#ff4538';\n    const html='<div style=\"display:flex;align-items:center;justify-content:center;width:14px;height:14px\"><div style=\"width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid '+color+';filter:drop-shadow(0 0 6px '+color+')\"><\/div><\/div>';\n    const m=L.marker(a.pos,{icon:L.divIcon({html,className:'',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);\n    m.bindPopup('<b style=\"color:'+color+'\">'+a.name+'<\/b><br>'+a.type+'<br><span style=\"color:rgba(255,255,255,.4)\">ETA: '+a.eta+'<\/span>');\n    S.ASL.push(m);\n  });\n}\nfunction drawZones(){\n  S.ZL.forEach(l=>l.remove());S.ZL=[];if(!LY.zones)return;\n  // Sensitive maritime zones\n  [[-10.7,141.95,80000,'Torres Strait Protected Zone'],[-12.3,131.0,60000,'Darwin Approach Zone'],[-14.5,128.5,70000,'Bonaparte Fishing Closure']].forEach(([lat,lon,r,name])=>{\n    const c=L.circle([lat,lon],{radius:r,color:'rgba(59,130,246,.4)',fill:true,fillColor:'rgba(59,130,246,.04)',fillOpacity:1,weight:1.2,dashArray:'4 6'}).addTo(map);\n    c.bindPopup('<b style=\"color:#3b82f6\">'+name+'<\/b>');\n    S.ZL.push(c);\n  });\n}\nfunction drawTracks(){\n  Object.values(S.TL).forEach(l=>l.remove());Object.values(S.DL).forEach(l=>l.remove());\n  S.AR.forEach(l=>l.remove());S.HL.forEach(l=>l.remove());S.GM.forEach(l=>l.remove());\n  S.TL={};S.DL={};S.AR=[];S.HL=[];S.GM=[];\n  const ds=DS[S.id];\n  if(LY.tracks){\n    ds.tracks.features.forEach(f=>{\n      const risk=f.properties.risk_score||0,color=RCC(risk);\n      const coords=f.geometry.coordinates.map(c=>[c[1],c[0]]);\n      if(coords.length<2)return;\n      const line=L.polyline(coords,{color,weight:risk>=80?2.5:risk>=55?1.6:1,opacity:risk>=80?.95:.7}).addTo(map);\n      line.on('click',()=>selVessel(f.properties.mmsi));\n      S.TL[f.properties.mmsi]=line;\n      const last=coords[coords.length-1];\n      const dot=L.circleMarker(last,{radius:risk>=80?5:risk>=55?4:2.5,fillColor:color,color:risk>=80?'rgba(255,69,56,.2)':'transparent',weight:risk>=80?5:0,fillOpacity:1}).addTo(map);\n      dot.on('click',()=>selVessel(f.properties.mmsi));\n      S.DL[f.properties.mmsi]=dot;\n    });\n  }\n  if(LY.alerts){\n    (ds.alerts||[]).filter(a=>a.severity==='HIGH').slice(0,80).forEach(a=>{\n      S.AR.push(L.circleMarker([+a.lat,+a.lon],{radius:20,color:'rgba(255,69,56,.15)',fill:false,weight:1.5,interactive:false}).addTo(map));\n    });\n  }\n  if(LY.heatmap){\n    // Traffic-density bloom: many translucent warm discs build up over hotspots\n    (ds.alerts||[]).forEach(a=>{\n      S.HL.push(L.circleMarker([+a.lat,+a.lon],{radius:26,color:'transparent',fillColor:'#ff7a33',fillOpacity:.07,interactive:false}).addTo(map));\n      S.HL.push(L.circleMarker([+a.lat,+a.lon],{radius:13,color:'transparent',fillColor:'#ffd24d',fillOpacity:.06,interactive:false}).addTo(map));\n    });\n  }\n}\nfunction isolateTrack(mmsi){\n  const mStr=String(mmsi||'');\n  Object.entries(S.TL).forEach(([id,l])=>{ if(id!==mStr)l.remove(); });\n  Object.entries(S.DL).forEach(([id,l])=>{ if(id!==mStr)l.remove(); });\n  S.RFL.forEach(l=>{try{l.remove();}catch(e){}});S.RFL=[];\n  S.AR.forEach(l=>{try{l.remove();}catch(e){}});\n  S.GM.forEach(l=>l.remove());S.GM=[];\n  var oldLeg=document.getElementById('track-legend');if(oldLeg)oldLeg.remove();\n\n  const feat=(DS[S.id].tracks.features||[]).find(f=>String(f.properties.mmsi)===mStr);\n  if(!feat)return;\n\n  const tp=feat.properties;\n  const aisC=tp.ais_coords||feat.geometry.coordinates.map(c=>[c[0],c[1]]);\n  const rfC=tp.rf_coords||[];\n  const rfH=tp.rf_heard||[];\n  const gaps=new Set(tp.gap_steps||[]);\n  const devs=tp.deviations_m||[];\n  const n=Math.min(aisC.length,rfC.length);\n\n  // - 1. AIS full path: thick blue solid line -\n  if(S.TL[mStr]){\n    S.TL[mStr].setStyle({color:'#3b82f6',weight:3,opacity:.95,dashArray:null});\n  }\n\n  // - 2. RF observed path: amber dashed line, only where heard -\n  // Split into contiguous heard segments so the line breaks at coverage gaps\n  var rfSeg=[];\n  for(var i=0;i<n;i++){\n    if(rfH[i]&&!gaps.has(i)){\n      rfSeg.push([rfC[i][1],rfC[i][0]]);\n    } else {\n      if(rfSeg.length>1){\n        S.RFL.push(L.polyline(rfSeg,{color:'#f59e0b',weight:2.5,opacity:.9,dashArray:'10 6',interactive:false}).addTo(map));\n      }\n      rfSeg=[];\n    }\n  }\n  if(rfSeg.length>1){\n    S.RFL.push(L.polyline(rfSeg,{color:'#f59e0b',weight:2.5,opacity:.9,dashArray:'10 6',interactive:false}).addTo(map));\n  }\n\n  // - 3. Deviation fill: shaded polygon between AIS and RF where they split -\n  // Group consecutive points where deviation>200m into bands, fill with colour\n  var bandPts=[];\n  for(var i=0;i<n;i++){\n    var dev=devs[i]||0;\n    var heard=rfH[i]&&!gaps.has(i);\n    if(heard&&dev>200){\n      bandPts.push(i);\n    } else {\n      if(bandPts.length>0){\n        // Draw filled band: go along AIS fwd, RF backward\n        var poly=[];\n        for(var j=0;j<bandPts.length;j++) poly.push([aisC[bandPts[j]][1],aisC[bandPts[j]][0]]);\n        for(var j=bandPts.length-1;j>=0;j--) poly.push([rfC[bandPts[j]][1],rfC[bandPts[j]][0]]);\n        var maxDev=Math.max.apply(null,bandPts.map(function(bi){return devs[bi]||0;}));\n        var fillCol=maxDev>800?'rgba(239,68,68,.15)':'rgba(245,158,11,.12)';\n        var borderCol=maxDev>800?'#ef4444':'#f59e0b';\n        S.RFL.push(L.polygon(poly,{color:borderCol,weight:0.5,opacity:.4,fillColor:fillCol,fillOpacity:1,interactive:false}).addTo(map));\n        bandPts=[];\n      }\n    }\n  }\n  if(bandPts.length>0){\n    var poly=[];\n    for(var j=0;j<bandPts.length;j++) poly.push([aisC[bandPts[j]][1],aisC[bandPts[j]][0]]);\n    for(var j=bandPts.length-1;j>=0;j--) poly.push([rfC[bandPts[j]][1],rfC[bandPts[j]][0]]);\n    var maxDev=Math.max.apply(null,bandPts.map(function(bi){return devs[bi]||0;}));\n    var fillCol=maxDev>800?'rgba(239,68,68,.15)':'rgba(245,158,11,.12)';\n    var borderCol=maxDev>800?'#ef4444':'#f59e0b';\n    S.RFL.push(L.polygon(poly,{color:borderCol,weight:0.5,opacity:.4,fillColor:fillCol,fillOpacity:1,interactive:false}).addTo(map));\n  }\n\n  // - 4. AIS gap markers: red circles where AIS went dark -\n  gaps.forEach(function(gi){\n    if(gi>=n)return;\n    var pt=[rfC[gi][1],rfC[gi][0]];\n    var heard=rfH[gi];\n    var col=heard?'#ef4444':'#64748b';\n    var m=L.circleMarker(pt,{radius:8,color:col,fillColor:col+'33',fillOpacity:1,weight:2,interactive:true}).addTo(map);\n    m.bindPopup(\n      '<div style=\"font:500 11px/1.5 monospace;color:#e2e8f0;background:#0f172a;padding:10px 12px;border-radius:4px;border:1px solid '+col+';min-width:180px\">'\n      +'<div style=\"color:'+col+';font-weight:700;margin-bottom:5px\">AIS '+(heard?'DARK + RF ACTIVE':'GAP - NO RF')+'<\\/div>'\n      +(heard?'<div style=\"color:#f59e0b;font-size:10px\">Vessel transmitting with AIS off.<br>Deliberate disabling.<\\/div>'\n             :'<div style=\"color:#94a3b8;font-size:10px\">AIS silent, outside RF coverage.<br>Cannot confirm position.<\\/div>')\n      +'<\\/div>'\n    );\n    S.GM.push(m);\n  });\n\n  // - 5. No-coverage zones: grey dashed line on AIS path -\n  var gapSeg=[];\n  for(var i=0;i<n;i++){\n    if(!rfH[i]){\n      gapSeg.push([aisC[i][1],aisC[i][0]]);\n    } else {\n      if(gapSeg.length>1){\n        S.RFL.push(L.polyline(gapSeg,{color:'#475569',weight:1.5,opacity:.4,dashArray:'4 6',interactive:false}).addTo(map));\n      }\n      gapSeg=[];\n    }\n  }\n  if(gapSeg.length>1){\n    S.RFL.push(L.polyline(gapSeg,{color:'#475569',weight:1.5,opacity:.4,dashArray:'4 6',interactive:false}).addTo(map));\n  }\n\n  // - 6. Map legend -\n  var leg=document.createElement('div');\n  leg.id='track-legend';\n  leg.style.cssText='position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(8,18,34,.95);border:1px solid #1e3a5f;border-radius:4px;padding:8px 16px;display:flex;gap:20px;z-index:1000;pointer-events:none;font:500 10px/1.4 monospace;white-space:nowrap;backdrop-filter:blur(4px);';\n  leg.innerHTML=\n    '<span style=\"display:flex;align-items:center;gap:7px\"><span style=\"display:inline-block;width:26px;height:3px;background:#3b82f6;border-radius:2px\"><\\/span><span style=\"color:#60a5fa\">AIS reported<\\/span><\\/span>'\n    +'<span style=\"display:flex;align-items:center;gap:7px\"><span style=\"display:inline-block;width:26px;height:0;border-top:2.5px dashed #f59e0b\"><\\/span><span style=\"color:#f59e0b\">RF observed<\\/span><\\/span>'\n    +'<span style=\"display:flex;align-items:center;gap:7px\"><span style=\"display:inline-block;width:14px;height:8px;background:rgba(245,158,11,.25);border:1px solid #f59e0b;border-radius:1px\"><\\/span><span style=\"color:#f59e0b\">Deviation zone<\\/span><\\/span>'\n    +'<span style=\"display:flex;align-items:center;gap:7px\"><span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid #ef4444;background:rgba(239,68,68,.2)\"><\\/span><span style=\"color:#ef4444\">AIS gap<\\/span><\\/span>'\n    +'<span style=\"display:flex;align-items:center;gap:7px\"><span style=\"display:inline-block;width:26px;height:0;border-top:1.5px dashed #475569;opacity:.6\"><\\/span><span style=\"color:#475569\">No RF coverage<\\/span><\\/span>';\n  document.getElementById('map').appendChild(leg);\n\n  // - 7. Fit bounds to full AIS track -\n  try{\n    var pts=aisC.map(function(c){return[c[1],c[0]];});\n    if(pts.length>1) map.fitBounds(L.latLngBounds(pts),{padding:[60,80],maxZoom:11});\n  }catch(e){}\n}\n\nfunction resetIsolation(){\n  S.GM.forEach(l=>l.remove());S.GM=[];\n  S.RFL.forEach(l=>{try{l.remove();}catch(e){}});S.RFL=[];\n  var leg=document.getElementById('track-legend');if(leg)leg.remove();\n  drawTracks();drawRF();\n}\nmap.on('click',e=>{\n  if(!e.originalEvent.target.closest('.panel')&&!e.originalEvent.target.closest('.leaflet-marker-icon')&&!e.originalEvent.target.closest('.leaflet-interactive')){\n    S.selA=null;S.selV=null;\n    document.getElementById('rp').classList.add('collapsed','empty');\n    document.getElementById('de').style.display='flex';\n    document.getElementById('ds').style.display='none';\n    buildAL();buildVL();resetIsolation();\n  }\n});\nfunction togL(name){\n  LY[name]=!LY[name];\n  document.getElementById('mc-'+name).classList.toggle('on',LY[name]);\n  const isIsolated=S.selA!==null||S.selV!==null;\n  if(name==='grid'){drawGrid();return;}\n  if(name==='sensors'){drawSensors();return;}\n  if(name==='assets'){drawAssets();return;}\n  if(name==='zones'){drawZones();return;}\n  if(name==='tracks'){\n    // Toggle all AIS track lines/dots instantly\n    const op=LY.tracks?1:0;\n    Object.entries(S.TL).forEach(([id,l])=>{\n      if(isIsolated){\n        const mStr=S.selV||String((fAlerts()[S.selA]||{}).mmsi||'');\n        if(id===mStr) l.setStyle({opacity:op,weight:3.5}); // keep isolated one\n      } else {\n        const r=(DS[S.id].tracks.features.find(f=>String(f.properties.mmsi)===id)||{properties:{}}).properties.risk_score||0;\n        l.setStyle({opacity:op*(r>=80?.95:.7),weight:r>=80?2.5:r>=55?1.6:1});\n      }\n    });\n    Object.values(S.DL).forEach(l=>l.setStyle({fillOpacity:op}));\n    return;\n  }\n  if(name==='rf'){\n    // Toggle RF layer - if isolated, redraw for current vessel; else full RF\n    if(isIsolated){\n      const mStr=S.selV||String((fAlerts()[S.selA]||{}).mmsi||'');\n      if(!LY.rf){S.RFL.forEach(l=>{try{l.remove();}catch(e){}});S.RFL=[];}\n      else isolateTrack(mStr);\n    } else {\n      drawRF();\n    }\n    return;\n  }\n  if(name==='alerts'){\n    if(!LY.alerts){S.AR.forEach(l=>{try{l.setStyle({opacity:0,fillOpacity:0});}catch(e){}});}\n    else{S.AR.forEach(l=>{try{l.setStyle({opacity:1,fillOpacity:.15});}catch(e){}});}\n    return;\n  }\n  if(name==='heatmap'){drawTracks();return;}\n}\n\n// \u2550\u2550\u2550 TOPBAR \u2550\u2550\u2550\nfunction buildTabs(){\n  const el=document.getElementById('tb-tabs');el.innerHTML='';\n  const ds=DS['live'];if(!ds)return;\n  const t=document.createElement('div');t.className='tb-ds on';\n  t.innerHTML='<span class=\"tb-ds-type\" style=\"background:#1e3a5f;color:#60a5fa\">LIVE<\\/span>'\n    +'<span>'+ds.title+'<\\/span>'\n    +'<span class=\"tb-ds-n\">'+ds.summary.alerts+' alerts<\\/span>';\n  el.appendChild(t);\n}\nfunction updateBar(){\n  const s=DS[S.id].summary;\n  document.getElementById('cb-v').textContent=s.vessels;\n  document.getElementById('cb-h').textContent=s.high_alerts;\n  document.getElementById('cb-m').textContent=s.medium_alerts||(s.alerts-s.high_alerts);\n  document.getElementById('cb-a').textContent=s.alerts;\n  const fc=fusionCounts(S.FZ);['conf','dark','ghost'].forEach((k,j)=>{const el=document.getElementById('cb-'+k);if(el)el.textContent=[fc.CONFIRMED,fc.DARK,fc.GHOST][j];});\n}\nfunction updateClocks(){\n  const n=new Date();\n  document.getElementById('clk-utc').textContent=n.toUTCString().slice(17,25);\n  document.getElementById('clk-aest').textContent=n.toLocaleTimeString('en-AU',{timeZone:'Australia/Sydney',hour12:false});\n}\nsetInterval(updateClocks,1000);updateClocks();\n\n// \u2550\u2550\u2550 FILTERS \u2550\u2550\u2550\nfunction buildFS(){\n  const ds=DS[S.id],tc={},sc={};\n  (ds.alerts||[]).forEach(a=>{tc[a.alert_type]=(tc nnerHTML='<span class=\"ph-dot\"><\/span>'+(type==='alert'?'Alert Intelligence':'Vessel Intelligence');\n  document.getElementById('rp-id').textContent=type==='alert'?obj.alert_id:obj.mmsi;\n  renderDetail(type,obj);\n}\nfunction clearDetail(){\n  S.selA=null;S.selV=null;\n  document.getElementById('rp').classList.add('collapsed');\n  document.getElementById('rp').classList.add('empty');\n  document.getElementById('de').style.display='flex';\n  document.getElementById('ds').style.display='none';\n  document.getElementById('rp-id').textContent='';\n  buildAL();buildVL();resetIsolation();\n}\nfunction riskGauge(score,color){\n  const r=24,c=2*Math.PI*r,off=c*(1-score/100);\n  return '<div class=\"dh-gauge\"><svg width=\"64\" height=\"64\"><circle cx=\"32\" cy=\"32\" r=\"'+r+'\" fill=\"none\" stroke=\"var(--e2)\" stroke-width=\"4\"/><circle cx=\"32\" cy=\"32\" r=\"'+r+'\" fill=\"none\" stroke=\"'+color+'\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"'+c+'\" stroke-dashoffset=\"'+off+'\"/><\/svg><div class=\"dh-gauge-v\" style=\"color:'+color+'\">'+score+'<\/div><\/div>';\n}\nfunction renderDetail(type,obj){\n  const ds=document.getElementById('ds');\n  const vessel=type==='alert'?{mmsi:obj.mmsi,vessel_type:obj.vessel_type,vessel_name:obj.vessel_name,risk_score:obj.risk_score,last_seen:obj.timestamp,first_seen:obj.timestamp,last_lat:obj.lat,last_lon:obj.lon,positions:1}:obj;\n  // Try to find the full vessel record\n  const vRec=(DS[S.id].vessels_list||[]).find(x=>String(x.mmsi)===String(vessel.mmsi))||vessel;\n  const c=RCC(vRec.risk_score);\n  const va=(DS[S.id].alerts||[]).filter(a=>String(a.mmsi)===String(vRec.mmsi));\n  const status=va.length===0?'<span class=\"dh-status dhs-active\">Active<\/span>':va.some(a=>a.alert_type==='AIS_GAP')?'<span class=\"dh-status dhs-silent\">Silent<\/span>':'<span class=\"dh-status dhs-alert\">Alerted<\/span>';\n\n  // Header\n  let html='<div class=\"dh\">'+\n    '<div class=\"dh-row1\"><div><div class=\"dh-id\">' div style=\"font:700 12px/1 var(--mono);color:'+s.col+';margin-bottom:4px\">'+s.val+'<\\/div>';\n      html+='<div style=\"font:400 8px/1 var(--mono);color:var(--muted);letter-spacing:.8px\">'+s.label+'<\\/div>';\n      html+='<\\/div>';\n    });\n    html+='<\\/div>';\n    if(rfAlerts.length){\n      html+='<div style=\"margin-bottom:12px\">';\n      html+='<div style=\"font:600 9px/1 var(--mono);color:var(--muted);letter-spacing:.8px;margin-bottom:6px\">ROUTE ANOMALIES<\\/div>';\n      rfAlerts.forEach(function(a){\n        const col=a.severity==='HIGH'?'#ef4444':a.severity==='MEDIUM'?'#f59e0b':'#64748b';\n        html+='<div style=\"background:'+col+'18;border:1px solid '+col+'44;border-radius:3px;padding:7px 10px;margin-bottom:5px;cursor:pointer\" onclick=\"selAById(\\''+a.alert_id+'\\')\">';\n        html+='<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:3px\">';\n        html+='<span style=\"font:700 8px/1 var(--mono);color:'+col+'\">'+a.alert_type.replace(/_/g,' ')+'<\\/span>';\n        html+='<span style=\"font:400 9px/1 var(--mono);color:var(--muted)\">'+a.timestamp.slice(0,10)+'<\\/span>';\n        html+='<span style=\"font:700 9px/1 var(--mono);color:'+col+';margin-left:auto\">'+a.risk_score+'<\\/span>';\n        html+='<\\/div>';\n        html+='<div style=\"font:400 9px/1.4 var(--mono);color:var(--body)\">'+a.title+'<\\/div><\\/div>';\n      });\n      html+='<\\/div>';\n    }\n    html+='<div style=\"font:600 9px/1 var(--mono);color:var(--muted);letter-spacing:.8px;margin-bottom:6px\">ROUTE COMPARISON ('+n+' observation points)<\\/div>';\n    html+='<div style=\"display:grid;grid-template-columns:36px 1fr 1fr 56px 56px 48px;border-bottom:1px solid var(--e1);padding:0 0 4px;margin-bottom:2px\">';\n    ['#','AIS POSITION','RF OBSERVATION','DEV','NODES','SNR'].forEach(function(h){\n      html+='<div style=\"font:600 7px/1 var(--mono);color:var(--muted);letter-spacing:.8px;padding:0 4px\">'+h+'<\\/div>';\n    });\n    html+='<\\/div>';\n    const STEP=Math.max(1,Math.floor(n/30));\n    for(var si=0;si<n;si+=STEP){\n      const aisP=aisC[si]||[0,0];\n      const rfP=rfC[si]||[0,0];\n      const dev=devs[si]||0;\n      const h2=heard[si];\n      const isGap=gaps.has(si);\n      const ns=(rfNodes[si]||[]).join(',');\n      const snrVal=tp.rf_snr&&tp.rf_snr[si]!=null?tp.rf_snr[si].toFixed(0)+'dB':'none';\n      const rowCol=isGap?'rgba(245,158,11,.07)':!h2?'rgba(30,15,0,.4)':dev>800?'rgba(239,68,68,.07)':dev>300?'rgba(245,158,11,.05)':'';\n      const devCol=dev>800?'#ef4444':dev>300?'#f59e0b':'#00e5c4';\n      const rfText=isGap?('AIS DARK '+(h2?'RF HEARD':'RF SILENT')):!h2?'no coverage':(rfP[1].toFixed(3)+','+rfP[0].toFixed(3));\n      const rfTextCol=isGap?'#f59e0b':!h2?'#475569':'#00e5c4';\n      html+='<div style=\"display:grid;grid-template-columns:36px 1fr 1fr 56px 56px 48px;border-bottom:1px solid var(--e1);padding:3px 0;background:'+rowCol+'\">';\n      html+='<div style=\"font:400 8px/1 var(--mono);color:var(--muted);padding:0 4px;display:flex;align-items:center\">'+si+'<\\/div>';\n      html+='<div style=\"font:400 8px/1 var(--mono);color:#60a5fa;padding:0 4px;display:flex;align-items:center\">'+aisP[1].toFixed(3)+','+aisP[0].toFixed(3)+'<\\/div>';\n      html+='<div style=\"font:400 8px/1 var(--mono);color:'+rfTextCol+';padding:0 4px;display:flex;align-items:center\">'+rfText+'<\\/div>';\n      html+='<div style=\"font:700 8px/1 var(--mono);color:'+devCol+';padding:0 4px;display:flex;align-items:center\">'+(dev>0?dev+'m':'none')+'<\\/div>';\n      html+='<div style=\"font:400 8px/1 var(--mono);color:#f59e0b;padding:0 4px;display:flex;align-items:center\">'+ns+'<\\/div>';\n      html+='<div style=\"font:400 8px/1 var(--mono);color:var(--muted);padding:0 4px;display:flex;align-items:center\">'+snrVal+'<\\/div>';\n      html+='<\\/div>';\n    }\n    if(aisC.length>0){\n      const lats=aisC.map(c=>c[1]);const lons=aisC.map(c=>c[0]);\n      try{map.fitBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]],{padding:[40,40]});}catch(e){}\n    }\n    dc.innerHTML=html;\n  } else if(S.detailTab==='comms'){\n    // REAL RF FUSION READOUT (driven by S.FZ)\n    const fu=S.FZ[String(vRec.mmsi)]||{state:'CLEAR',covered:false,maxSensors:0,rfConfidence:0,ellipse:[null,null]};\n    const fm=_fusionMeta(fu.state);\n    const lat=+vRec.last_lat,lon=+vRec.last_lon;\n    const contrib=_contributingSensors(lat,lon);\n    const emit=_emitterProfile(fu);\n    const ell=fu.ellipse[0]?(fu.ellipse[0].toFixed(1)+' \u00d7 '+fu.ellipse[1].toFixed(1)+' nm'):'no fix';\n    let html='<div class=\"d-sec\" style=\"border:1px solid '+fm.c+'44;background:'+fm.c+'0d;border-radius:5px;padding:12px 14px;margin-bottom:12px\"><div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:8px;height:8px;border-radius:50%;background:'+fm.c+';box-shadow:0 0 8px '+fm.c+'\"><\/div><span style=\"font:700 12px/1 var(--mono);letter-spacing:1.5px;color:'+fm.c+'\">'+fm.label+'<\/span><span style=\"margin-left:auto;font:600 9px/1 var(--mono);color:var(--muted)\">RF\u00d7AIS STATE<\/span><\/div><\/div>';\n    html+='<div class=\"d-sec\"><div class=\"d-sec-l\">RF geolocation<\/div>'+\n      '<div class=\"drow\"><span class=\"dk\">RF fix<\/span><span class=\"dv'+(fu.covered?' g':' r')+'\">'+(fu.covered?'Acquired':'No coverage')+'<\/span><\/div>'+\n      '<div class=\"drow\"><span class=\"dk\">Contributing sensors<\/span><span class=\"dv\">'+(fu.maxSensors||0)+' / '+SENSORS.length+'<\/span><\/div>'+\n      '<div class=\"drow\"><span class=\"dk\">Geolocation method<\/span><span class=\"dv\">'+(fu.maxSensors>=3?'TDOA (3+ station)':fu.maxSensors===2?'TDOA/AOA (2 station)':fu.maxSensors===1?'Single-station AOA':'\u2014')+'<\/span><\/div>'+\n      '<div class=\"drow\"><span class=\"dk\">Confidence ellipse<\/span><span class=\"dv\">'+ell+'<\/span><\/div>'+\n      '<div class=\"drow\"><span class=\"dk\">Fix confidence<\/span><span class=\"dv\" style=\"color:'+(fu.rfConfidence>=.9?'#00e5c4':fu.rfConfidence>=.7?'#f59e0b':'#ff4538')+'\">'+Math.round(fu.rfConfidence*100)+'%<\/span><\/div>'+\n      '<\/div>';\n    html+='<div class=\"d-sec\"><div class=\"d-sec-l\">Emitter classification<\/div>'+\n      '<div class=\"drow\"><span class=\"dk\">Detected emitter<\/span><span class=\"dv\">'+emit.type+'<\/span><\/div>'+\n      '<div class=\"exp-box\" style=\"margin-top:8px\">'+emit.detail+'<\/div><\/div>';\n    html+='<div class=\"d-sec\"><div class=\"d-sec-l\">Contributing stations<\/div>';\n    if(contrib.length){contrib.forEach(s=>{html+='<div class=\"drow\"><span class=\"dk\">'+s.code+' \u00b7 '+s.name.split(' \u00b7 ')[0]+'<\/span><span class=\"dv\">'+s.km+' km<\/span><\/div>';});}\n    else{html+='<div class=\"exp-box\">Vessel outside RF sensor coverage.<\/div>';}\n    html+='<\/div>';\n    html+='<div class=\"spec\"><div class=\"mc-head\" style=\"margin-bottom:6px\"><div class=\"mc-title\">RF Spectrum \u00b7 vessel band<\/div><div class=\"mc-stat\">'+(fu.covered?'<span style=\"color:var(--grn)\">Emission<\/span>':'<span style=\"color:var(--red)\">None<\/span>')+'<\/div><\/div><canvas class=\"spec-canvas\" id=\"spec-canvas\" width=\"400\" height=\"50\"><\/canvas><div class=\"spec-axis\"><span>3.0<\/span><span>5.6<\/span><span>9.4 GHz X-band<\/span><span>162 MHz<\/span><\/div><\/div>';\n    dc.innerHTML=html;\n    setTimeout(()=>drawSpectrum(fu.covered),20);\n  } else if(S.detailTab==='alerts'){\n    let html='<div class=\"d-sec\"><div class=\"d-sec-l\">Alert history \u2014 '+va.length+'<\/div>'+\n      (va.length?va.sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).map(a=>{\n        const gap=parseGapHours(a.evidence);\n        return'<div class=\"va-item\" onclick=\"selAById(\\''+a.alert_id+'\\')\"><div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px\"><span class=\"sev s'+a.severity[0]+'\">'+a.severity+'<\/span><span style=\"font:400 9px/1 var(--mono);color:var(--muted)\">'+(TL[a.alert_type]||a.alert_type)+(gap?' \u00b7 '+gap.toFixed(0)+'h':'')+'<\/span><span style=\"font:700 13px/1 var(--mono);margin-left:auto;color:'+RCC(+a.risk_score)+'\">'+a.risk_score+'<\/span><\/div><div style=\"font:500 11px/1.3 var(--sans);color:var(--head)\">'+(a.title||'')+'<\/div><div style=\"font:400 9px/1 var(--mono);color:var(--muted);margin-top:4px\">'+(a.timestamp||'').slice(0,16).replace('T',' ')+'Z<\/div><\/div>';\n      }).join(''):'<div style=\"font:400 10px/1.5 var(--mono);color:var(--muted);padding:8px 0\">No alerts for this vessel<\/div>')+\n      '<\/div>';\n    dc.innerHTML=html;\n  } else if(S.detailTab==='tasking'){\n    // Find available assets and show distance/ETA\n    let html='<div class=\"d-sec\"><div class=\"d-sec-l\">Available patrol assets<\/div>'+\n      ASSETS.filter(a=>a.status!=='unavail').map(a=>{\n        const d=haversineKm([vRec.last_lat,vRec.last_lon],a.pos);\n        const c=a.status==='av'?'var(--grn)':'var(--amb)';\n        return'<div class=\"va-item\"><div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\"><div style=\"width:8px;height:8px;border-radius:50%;background:'+c+';box-shadow:0 0 6px '+c+'\"><\/div><span style=\"font:500 12px/1 var(--sans);color:var(--head);flex:1\">'+a.name+'<\/span><span style=\"font:700 11px/1 var(--mono);color:'+c+'\">'+d.toFixed(0)+' km<\/span><\/div><div style=\"font:400 10px/1.3 var(--mono);color:var(--muted)\">'+a.type+' \u00b7 ETA '+a.eta+'<\/div><\/div>';\n      }).join('')+'<\/div>';\n    html+='<button class=\"btn-action\">Dispatch Asset \u2192<\/button>';\n    dc.innerHTML=html;\n  }\n}\nfunction setDetailTab(t){S.detailTab=t;\n  // Re-render only the inner content + tab bar\n  document.querySelectorAll('.dt').forEach(el=>el.classList.toggle('on',el.textContent.toLowerCase()===t));\n  // Need to find which type and obj\n  if(S.selA!==null){const a=fAlerts()[S.selA];if(a){const vRec=(DS[S.id].vessels_list||[]).find(x=>String(x.mmsi)===String(a.mmsi))||{mmsi:a.mmsi,vessel_type:a.vessel_type,risk_score:a.risk_score,positions:1,first_seen:a.timestamp,last_seen:a.timestamp,last_lat:a.lat,last_lon:a.lon};renderDetailContent('alert',a,vRec,(DS[S.id].alerts||[]).filter(x=>String(x.mmsi)===String(a.mmsi)))}}\n  else if(S.selV!==null){const v=(DS[S.id].vessels_list||[]).find(x=>String(x.mmsi)===String(S.selV));if(v)renderDetailContent('vessel',v,v,(DS[S.id].alerts||[]).filter(x=>String(x.mmsi)===String(v.mmsi)))}\n}\n\nfunction renderSparkline(vals){\n  if(!vals||!vals.length)return '<div style=\"height:40px\"><\/div>';\n  const max=Math.max(...vals,1);const w=300,h=40;\n  const pts=vals.map((v,i)=>(i*w/(vals.length-1))+','+(h-v/max*h*0.9-2)).join(' ');\n  return '<svg width=\"100%\" height=\"'+h+'\" viewBox=\"0 0 '+w+' '+h+'\" preserveAspectRatio=\"none\" style=\"display:block\"><polyline points=\"'+pts+'\" fill=\"none\" stroke=\"var(--sig)\" stroke-width=\"1.5\"/><polyline points=\"0,'+h+' '+pts+' '+w+','+h+'\" fill=\"rgba(0,229,196,.1)\" stroke=\"none\"/><\/svg>';\n}\n\nfunction drawSpectrum(isLive){\n  const c=document.getElementById('spec-canvas');if(!c)return;\n  const ctx=c.getContext('2d'),W=c.width,H=c.height;\n  ctx.clearRect(0,0,W,H);\n  // Background grid\n  ctx.strokeStyle='rgba(0,229,196,.05)';ctx.lineWidth=0.5;\n  for(let i=0;i<W;i+=W/8){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}\n  // Noise floor\n  ctx.fillStyle='rgba(0,229,196,.08)';\n  for(let x=0;x<W;x++){const h=Math.random()*4+1;ctx.fillRect(x,H-h,1,h)}\n  // Signal peaks at AIS frequencies (~162 MHz = rightmost) and VHF 16 (~156.8 = leftmost area)\n  if(isLive){\n    // AIS-A peak\n    const aisX=W*0.85;ctx.fillStyle='#00e5c4';\n    for(let i=-3;i<=3;i++){const h=Math.max(0,30-Math.abs(i)*8);ctx.fillRect(aisX+i,H-h,1,h)}\n    // AIS-B peak\n    const aisBX=W*0.93;\n    for(let i=-3;i<=3;i++){const h=Math.max(0,28-Math.abs(i)*8);ctx.fillRect(aisBX+i,H-h,1,h)}\n    // VHF 16 peak\n    const vhfX=W*0.15;ctx.fillStyle='#f59e0b';\n    for(let i=-4;i<=4;i++){const h=Math.max(0,22-Math.abs(i)*5);ctx.fillRect(vhfX+i,H-h,1,h)}\n  }\n}\n\n// \u2550\u2550\u2550 INTERACTIONS \u2550\u2550\u2550\nfunction selA(i){\n  S.selA=i;S.selV=null;S.detailTab='track';\n  buildAL();buildVL();\n  const a=fAlerts()[i];\n  if(a){\n    showDetail('alert',a);\n    if(BOOBOOK_MODE==='live'&&a.mmsi){boobookLoadComparison(a.mmsi).then(function(){isolateTrack(a.mmsi);buildBottomMid();});}\n    else { isolateTrack(a.mmsi); }\n    buildBottomMid();\n  }\n}\nfunction selAById(id){const i=fAlerts().findIndex(a=>a.alert_id===id);if(i>=0)selA(i)}\nfunction selVessel(mmsi){\n  S.selV=String(mmsi);S.selA=null;S.detailTab='track';\n  switchTab('vessels');buildVL();\n  const v=(DS[S.id].vessels_list||[]).find(x=>String(x.mmsi)===String(mmsi));\n  if(v){\n    showDetail('vessel',v);\n    if(BOOBOOK_MODE==='live'){boobookLoadComparison(mmsi).then(function(){isolateTrack(mmsi);buildBottomMid();});}\n    else { isolateTrack(mmsi); }\n    buildBottomMid();\n  }\n}\nfunction tSev(s){S.sevF.has(s)?S.sevF.delete(s):S.sevF.add(s);S.selA=null;buildFS();buildAL()}\nfunction tType(t){S.typeF=S.typeF===t?null:t;S.selA=null;buildFS();buildAL()}\nfunction tFus(s){S.fusF=S.fusF===s?null:s;S.selA=null;buildFS();buildAL()}\nfunction switchTab(tab){S.inner=tab;['alerts','vessels'].forEach(t=>{document.getElementById('v-'+t).style.display=t===tab?'flex':'none';document.getElementById('it-'+t).classList.toggle('on',t===tab)});if(tab==='vessels')buildVL()}\n\n// \u2550\u2550\u2550 BOTTOM PANEL \u2550\u2550\u2550\nfunction buildActivityFeed(){\n  const alerts=(DS[S.id].alerts||[]).slice().sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).slice(0,80);\n  document.getElementById('bpt-feed-c').textContent=alerts.length;\n  document.getElementById('feed').innerHTML=alerts.map(a=>{\n    const cls=a.severity==='HIGH'?'high':a.severity==='MEDIUM'?'med':'low';\n    const c=a.severity==='HIGH'?'r':a.severity==='MEDIUM'?'a':'g';\n    const t=(a.timestamp||'').slice(0,16).replace('T',' ');\n    let msg='';\n    if(a.alert_type==='AIS_GAP'){const g=parseGapHours(a.evidence);msg='<b>'+(a.vessel_type||'UNK')+'<\/b> \u00b7 MMSI '+a.mmsi+' went <span class=\"r\">silent<\/span> for <b>'+(g?g.toFixed(0)+'h':'unknown')+'<\/b>'}\n    else if(a.alert_type==='IMPOSSIBLE_SPEED')msg='<b>'+(a.vessel_type||'UNK')+'<\/b> \u00b7 MMSI '+a.mmsi+' \u00b7 <span class=\"r\">impossible speed<\/span> \u00b7 possible spoof';\n    else if(a.alert_type==='LOITERING')msg='<b>'+(a.vessel_type||'UNK')+'<\/b> \u00b7 MMSI '+a.mmsi+' \u00b7 <span class=\"a\">loitering<\/span> in tight radius';\n    else if(a.alert_type==='SENSITIVE_ZONE')msg='<b>'+(a.vessel_type||'UNK')+'<\/b> \u00b7 MMSI '+a.mmsi+' \u00b7 entered <span class=\"a\">sensitive zone<\/span>';\n    else msg='<b>'+(a.vessel_type||'UNK')+'<\/b> \u00b7 MMSI '+a.mmsi+' \u00b7 '+(a.title||'');\n    return'<div class=\"feed-item '+cls+'\" onclick=\"selAById(\\''+a.alert_id+'\\')\"><div class=\"feed-time\">'+t+'Z<\/div><div class=\"feed-msg\">'+msg+'<\/div><\/div>';\n  }).join('');\n}\nfunction buildBottomMid(){\n  const ds=DS[S.id];\n  const alerts=ds.alerts||[];\n  const vList=ds.vessels_list||[];\n  const s=ds.summary||{};\n\n  // \u2500\u2500 Tile 1 \u00b7 Silence-duration distribution (the core signal) \u2500\u2500\n  const gd=getGapDistribution(alerts);const gMax=Math.max(...gd,1);\n  const gapLabels=['<6h','6\u201312h','12\u201324h','1\u20132d','2\u20137d','7d+'];\n  const gapTotal=alerts.filter(a=>a.alert_type==='AIS_GAP').length;\n  const tile1=\n    '<div class=\"bp-tile\"><div class=\"bp-tile-l\">Silence Duration \u00b7 '+gapTotal+' gaps<\/div>'+\n    '<div class=\"bp-tile-canvas\"><div style=\"display:flex;align-items:flex-end;height:100%;gap:5px\">'+\n    gd.map((n,i)=>{const pct=n/gMax*100;const c=i>=4?'#ff4538':i>=2?'#f59e0b':'#3b82f6';\n      return '<div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px\">'+\n        '<div style=\"font:600 8px/1 var(--mono);color:'+(n?c:'var(--d
