s=\"bp-tile-foot\"><span>RF re-acquisition<\/span><span>'+coveredTotal+' in coverage<\/span><\/div><\/div>';\n\n    // \u2500\u2500 Tile 6 \u00b7 3+ sensor fix coverage (RF geometry quality) \u2500\u2500\n  const fzAll=Object.values(S.FZ);const covered=fzAll.filter(f=>f.covered);\n  const s3=covered.filter(f=>f.maxSensors>=3).length, s2=covered.filter(f=>f.maxSensors===2).length, s1=covered.filter(f=>f.maxSensors===1).length;\n  const covTot=covered.length||1;const s3pct=Math.round(s3/covTot*100);\n  const tile6=\n    '<div class=\"bp-tile\"><div class=\"bp-tile-l\">RF Geometry Quality<\/div>'+\n    '<div class=\"bp-tile-canvas\" style=\"overflow:hidden\"><div style=\"display:flex;flex-direction:column;gap:9px;justify-content:center;height:100%\">'+\n      '<div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font:300 26px/1 var(--serif);color:#00e5c4\">'+s3pct+'%<\/span>'+\n        '<span style=\"font:400 9px/1.3 var(--mono);color:var(--muted)\">of '+covTot+' RF contacts<br>have 3+ sensor TDOA fix<\/span><\/div>'+\n      '<div style=\"height:6px;background:var(--e1);border-radius:2px;overflow:hidden;display:flex\">'+\n        '<div style=\"height:100%;width:'+Math.round(s3/covTot*100)+'%;background:#00e5c4;opacity:.85\"><\/div>'+\n        '<div style=\"height:100%;width:'+Math.round(s2/covTot*100)+'%;background:#f59e0b;opacity:.85\"><\/div>'+\n        '<div style=\"height:100%;width:'+Math.round(s1/covTot*100)+'%;background:#ff4538;opacity:.7\"><\/div><\/div>'+\n      '<div style=\"display:flex;gap:10px;font:500 8px/1 var(--mono)\"><span style=\"color:#00e5c4\">\u25cf '+s3+' tight<\/span><span style=\"color:#f59e0b\">\u25cf '+s2+' 2-stn<\/span><span style=\"color:#ff4538\">\u25cf '+s1+' weak<\/span><\/div>'+\n    '<\/div><\/div><div class=\"bp-tile-foot\"><span>fix confidence<\/span><span>TDOA geometry<\/span><\/div><\/div>';\n\n  // \u2500\u2500 Tile 7 \u00b7 Patrol-ready alerts (score >75 & confidence >70%) \u2500\u2500\n  const vl=ds.vessels_list||[];\n  let patrolReady=0,reviewQueue=0;\n  const abm7={};(alerts||[]).forEach(a=>{(abm7[String(a.mmsi)]=abm7[String(a.mmsi)]||[]).push(a);});\n  vl.forEach(v=>{const rm=riskModel(v,abm7[String(v.mmsi)]||[]);if(rm.score>=76&&rm.confidence>=.7)patrolReady++;else if(rm.score>=56)reviewQueue++;});\n  const tile7=\n    '<div class=\"bp-tile\" style=\"border-color:rgba(255,69,56,.2)\"><div class=\"bp-tile-l\" style=\"color:#ff4538\">Patrol-Ready Alerts<\/div>'+\n    '<div class=\"bp-tile-canvas\" style=\"overflow:hidden\"><div style=\"display:flex;flex-direction:column;gap:10px;justify-content:center;height:100%\">'+\n      '<div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font:300 30px/1 var(--serif);color:#ff4538\">'+patrolReady+'<\/span>'+\n        '<span style=\"font:400 9px/1.3 var(--mono);color:var(--muted)\">contacts score \u226576<br>at \u226570% confidence<\/span><\/div>'+\n      '<div style=\"display:flex;justify-content:space-between;font:500 9px/1 var(--mono);padding-top:6px;border-top:1px solid var(--e1)\">'+\n        '<span style=\"color:var(--muted)\">surveillance cue<\/span><span style=\"color:#f59e0b\">'+reviewQueue+'<\/span><\/div>'+\n    '<\/div><\/div><div class=\"bp-tile-foot\"><span>actionable now<\/span><span>tasking threshold<\/span><\/div><\/div>';\n\n  // \u2500\u2500 Tile 8 \u00b7 Sensor network health \u2500\u2500\n  const onlineSensors=SENSORS.filter(s=>s[4]==='P3');const plannedSensors=SENSORS.filter(s=>s[4]!=='P3');\n  const tile8=\n    '<div class=\"bp-tile\"><div class=\"bp-tile-l\">Sensor Network Health<\/div>'+\n    '<div class=\"bp-tile-canvas\" style=\"overflow:hidden\"><div style=\"display:flex;flex-direction:column;gap:5px;justify-content:center;height:100%\">'+\n      '<div style=\"display:flex;align-items:baseline;gap:6px;margin-bottom:3px\"><span style=\"font:300 22px/1 var(--serif);color:#00e5c4\">'+onlineSensors.length+'<\/span><span style=\"font:400 9px/1 var(--mono);color:var(--muted)\">/ '+SENSORS.length+' nodes online<\/span><\/div>'+\n      onlineSensors.slice(0,3).map(s=>'<div style=\"display:flex;align-items:center;gap:6px;font:500 8.5px/1 var(--mono)\"><div style=\"width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e\"><\/div><span style=\"color:var(--head);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">'+s[3].split(' \u00b7 ')[1]+'<\/span><span style=\"color:var(--muted)\">nominal<\/span><\/div>').join('')+\n      plannedSensors.slice(0,2).map(s=>'<div style=\"display:flex;align-items:center;gap:6px;font:500 8.5px/1 var(--mono)\"><div style=\"width:5px;height:5px;border-radius:50%;background:var(--muted)\"><\/div><span style=\"color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">'+s[3].split(' \u00b7 ')[0]+'<\/span><span style=\"color:var(--muted)\">planned<\/span><\/div>').join('')+\n    '<\/div><\/div><div class=\"bp-tile-foot\"><span style=\"color:#22c55e\">'+onlineSensors.length+' nominal<\/span><span>'+plannedSensors.length+' planned<\/span><\/div><\/div>';\n\n  document.getElementById('bp-mid-content').innerHTML=tile1+tile5+tile6+tile7+tile2+tile8+tile3+tile4;\n}\nfunction buildAssets(){\n  document.getElementById('assets').innerHTML=ASSETS.map(a=>{\n    return'<div class=\"asset-item\"><div class=\"asset-dot '+a.status+'\"><\/div><div class=\"asset-name\">'+a.name+'<div style=\"font:400 9px/1.3 var(--mono);color:var(--muted);margin-top:2px\">'+a.type+'<\/div><\/div><div class=\"asset-meta\">'+(a.status==='unavail'?'<span style=\"color:var(--red)\">'+a.eta+'<\/span>':'<span style=\"color:var(--sig)\">'+a.eta+'<\/span>')+'<\/div><\/div>';\n  }).join('');\n}\n\nfunction setBpTab(t){\n  document.querySelectorAll('.bp-tab').forEach(el=>el.classList.toggle('on',el.dataset.bpt===t));\n  document.querySelectorAll('.bp-view').forEach(el=>el.classList.toggle('on',el.id==='bpv-'+t));\n}\nfunction toggleRP(){document.getElementById('rp').classList.toggle('collapsed')}\nfunction collapseRP(){document.getElementById('rp').classList.add('collapsed')}\nfunction setDataset(id){if(!DS[id]||id===S.id)return;S.id=id;S.selA=null;S.selV=null;S.FZ=buildFusion(id);buildTabs();renderAll()}\nfunction toggleBP(e){if(e)e.stopPropagation();document.getElementById('bp').classList.toggle('collapsed');const collapsed=document.getElementById('bp').classList.contains('collapsed');document.getElementById('bp-min').textContent=collapsed?'+':'\u2013'}\nfunction openBpTab(t){const bp=document.getElementById('bp');if(bp.classList.contains('collapsed')){bp.classList.remove('collapsed');document.getElementById('bp-min').textContent='\u2013'}setBpTab(t)}\n\n// \u2550\u2550\u2550 RENDER \u2550\u2550\u2550\nfunction renderAll(){\n  updateBar();drawGrid();drawSensors();drawAssets();drawZones();drawTracks();drawRF();buildFS();buildAL();buildActivityFeed();buildBottomMid();buildAssets();\n  if(S.inner==='vessels')buildVL();\n  document.getElementById('de').style.display='flex';\n  document.getElementById('ds').style.display='none';\n  document.getElementById('rp').classList.add('empty');\n  resetIsolation();\n}\nwindow.__BOOBOOK_STATIC__ = JSON.parse(JSON.stringify(DS['live']));\n\n// ====== BOOBOOK LIVE BACKEND ADAPTER ======\n// Connects this dashboard to the deployed platform at boobook-production.up.railway.app.\n// Transforms the live API responses into the DS['live'] shape the dashboard renders.\n// Falls back to the baked-in static dataset if the API is unreachable.\nvar BOOBOOK_API = 'https://boobook-production.up.railway.app';\nvar BOOBOOK_MODE = 'static';\nvar BOOBOOK_POLL = null;\n\nfunction boobookStatusDot(state, label){\n  var el = document.getElementById('boobook-conn');\n  if(!el) return;\n  var col = state==='live' ? '#00e5c4' : state==='replay' ? '#f59e0b' : '#64748b';\n  el.innerHTML = '<span style=\"display:inline-block;width:7px;height:7px;border-radius:50%;background:'+col+';margin-right:6px;box-shadow:0 0 6px '+col+'\"><'+'/span>'+label;\n}\n\nasync function boobookGet(path){\n  var r = await fetch(BOOBOOK_API + path, {mode:'cors'});\n  if(!r.ok) throw new Error('api '+r.status+' '+path);\n  return await r.json();\n}\n\n// Map live API -> DS['live'] shape\nfunction boobookSeverityFromRisk(rs){ return rs>=80?'HIGH':rs>=50?'MEDIUM':'LOW'; }\n\nfunction boobookBuildDataset(vessels, alerts, detections){\n  // vessels: /api/vessels  | alerts: /api/alerts | detections: /api/rf/detections\n  var vlist = vessels.map(function(v){\n    return {\n      mmsi: String(v.mmsi),\n      vessel_name: v.name || String(v.mmsi),\n      vessel_type: v.ship_type || 'Unknown',\n      risk_score: v.risk_score||0,\n      first_seen: v.last_seen ? new Date((v.last_seen-86400)*1000).toISOString() : null,\n      last_seen: v.last_seen ? new Date(v.last_seen*1000).toISOString() : null,\n      last_lat: v.lat, last_lon: v.lon,\n      positions: v.update_count||0,\n      is_dprk: v.is_dprk||0\n    };\n  });\n\n  // Index RF detections by mmsi for track overlay\n  var rfByMmsi = {};\n  (detections||[]).forEach(function(d){\n    var k = String(d.mmsi||d.dark_id||'');\n    if(!k) return;\n    (rfByMmsi[k] = rfByMmsi[k] || []).push(d);\n  });\n\n  var alist = alerts.map(function(a){\n    var ind = {};\n    try { ind = typeof a.indicators==='string' ? JSON.parse(a.indicators) : (a.indicators||{}); } catch(e){}\n    return {\n      alert_id: String(a.id),\n      alert_type: a.alert_type,\n      severity: a.severity || boobookSeverityFromRisk(a.risk_score||0),\n      risk_score: a.risk_score || (a.severity==='HIGH'?85:a.severity==='MEDIUM'?60:30),\n      mmsi: String(a.mmsi||''),\n      vessel_name: a.name || String(a.mmsi||a.name||''),\n      vessel_type: 'Unknown',\n      timestamp: a.ts ? new Date(a.ts*1000).toISOString() : null,\n      lat: a.lat, lon: a.lon,\n      title: a.name ? (a.name+' \\u2014 '+(a.alert_type||'').replace(/_/g,' ')) : (a.alert_type||'').replace(/_/g,' '),\n      explanation: a.description || '',\n      recommended_action: '',\n      evidence: ind,\n      _edge_case: a.alert_type,\n      _rf_nodes: ind.node ? [ind.node] : [],\n      _has_track: !!a.mmsi\n    };\n  });\n\n  var high = alist.filter(function(a){return a.severity==='HIGH';}).length;\n  var med  = alist.filter(function(a){return a.severity==='MEDIUM';}).length;\n  var low  = alist.filter(function(a){return a.severity==='LOW';}).length;\n  var dark = alist.filter(function(a){return a.alert_type==='DARK_VESSEL';}).length;\n\n  return {\n    id:'live',\n    title:'Northern Australia \\u2014 Live',\n    source:'Boobook platform (Railway) \\u2014 live AIS + RF fusion',\n    alerts: alist,\n    vessels_list: vlist,\n    tracks: {type:'FeatureCollection', features: []},  // tracks lazy-loaded per vessel via comparison\n    summary: {\n      vessels: vlist.length, alerts: alist.length,\n      high_alerts:high, medium_alerts:med, low_alerts:low,\n      dark_vessels:dark, rf_confirmed:(detections||[]).filter(function(d){return d.is_dark===0;}).length,\n      coverage_gaps:0\n    }\n  };\n}\n\nasync function loadLive(){\n  try {\n    boobookStatusDot('live','CONNECTING');\n    // trigger a fresh RF pulse so detections are current, then pull everything\n    try { await boobookGet('/api/rf/pulse/trigger'); } catch(e){}\n    var res = await Promise.all([\n      boobookGet('/api/vessels?limit=2000'),\n      boobookGet('/api/alerts?limit=500'),\n      boobookGet('/api/rf/detections')\n    ]);\n    var vessels = res[0].length!==undefined ? res[0] : (res[0].vessels||[]);\n    var alerts  = res[1].length!==undefined ? res[1] : (res[1].alerts||[]);\n    var dets    = res[2].length!==undefined ? res[2] : (res[2].detections||[]);\n    DS['live'] = boobookBuildDataset(vessels, alerts, dets);\n    BOOBOOK_MODE='live'; S.id='live'; S.selA=null; S.selV=null;\n    S.FZ = buildFusion('live'); buildTabs(); renderAll();\n    boobookStatusDot('live','LIVE \\u2014 '+vessels.length+' vessels');\n    if(BOOBOOK_POLL) clearInterval(BOOBOOK_POLL);\n    BOOBOOK_POLL = setInterval(boobookRefresh, 15000);\n  } catch(e){\n    console.warn('[BOOBOOK] live load failed:', e.message);\n    boobookStatusDot('static','OFFLINE \\u2014 static demo');\n  }\n}\n\nasync function boobookRefresh(){\n  if(BOOBOOK_MODE!=='live') return;\n  if(S.selA!==null || S.selV!==null) return;  // don't yank selection from operator\n  try {\n    var res = await Promise.all([\n      boobookGet('/api/vessels?limit=2000'),\n      boobookGet('/api/alerts?limit=500'),\n      boobookGet('/api/rf/detections')\n    ]);\n    var vessels = res[0].length!==undefined ? res[0] : (res[0].vessels||[]);\n    var alerts  = res[1].length!==undefined ? res[1] : (res[1].alerts||[]);\n    var dets    = res[2].length!==undefined ? res[2] : (res[2].detections||[]);\n    DS['live'] = boobookBuildDataset(vessels, alerts, dets);\n    S.FZ = buildFusion('live'); updateBar(); buildAL();\n    if(S.inner==='vessels') buildVL();\n    boobookStatusDot('live','LIVE \\u2014 '+vessels.length+' vessels');\n  } catch(e){}\n}\n\n// Lazy-load a vessel's real AIS+RF comparison track when selected\nasync function boobookLoadComparison(mmsi){\n  try {\n    var c = await boobookGet('/api/vessels/'+mmsi+'/comparison');\n    var ais = (c.ais_track||[]).slice().reverse(); // API returns newest-first\n    var feat = {\n      type:'Feature',\n      properties:{\n        mmsi: String(mmsi),\n        vessel_name: (c.vessel&&c.vessel.name)||String(mmsi),\n        vessel_type: (c.vessel&&c.vessel.ship_type)||'Unknown',\n        risk_score: (c.vessel&&c.vessel.risk_score)||0,\n        ais_coords: ais.map(function(p){return [p.lon,p.lat];}),\n        rf_coords:  (c.radar_returns||[]).map(function(p){return [p.lon_reported||p.lon, p.lat_reported||p.lat];}),\n        rf_heard:   (c.radar_returns||[]).map(function(){return true;}),\n        rf_nodes:   (c.radar_returns||[]).map(function(p){return [p.node_id||''];}),\n        rf_snr:     (c.radar_returns||[]).map(function(p){return p.snr_db||null;}),\n        deviations_m:(c.radar_returns||[]).map(function(p){return Math.round(p.discrepancy_m||0);}),\n        gap_steps:  []\n      }\n    };\n    // splice into DS tracks\n    var feats = DS['live'].tracks.features;\n    var idx = feats.findIndex(function(f){return String(f.properties.mmsi)===String(mmsi);});\n    if(idx>=0) feats[idx]=feat; else feats.push(feat);\n    return feat;\n  } catch(e){ console.warn('[BOOBOOK] comparison load failed', e.message); return null; }\n}\n\nfunction boobookSetMode(mode){\n  document.querySelectorAll('.boobook-mode-btn').forEach(function(b){\n    b.classList.toggle('on', b.getAttribute('data-mode')===mode);\n  });\n  if(mode==='live'){ loadLive(); }\n  else {\n    BOOBOOK_MODE='static';\n    if(BOOBOOK_POLL){clearInterval(BOOBOOK_POLL);BOOBOOK_POLL=null;}\n    S.id='live'; // static dataset is also keyed 'live' in DS; reload baked copy\n    if(window.__BOOBOOK_STATIC__){ DS['live']=JSON.parse(JSON.stringify(window.__BOOBOOK_STATIC__)); }\n    S.FZ=buildFusion('live'); buildTabs(); renderAll();\n    boobookStatusDot('static','STATIC');\n  }\n}\n\nS.FZ=buildFusion(S.id);console.log('[FUSION]',S.id,fusionCounts(S.FZ));buildTabs();renderAll();\n// Attempt live backend on boot; falls back to static if unreachable.\nsetTimeout(function(){ boobookStatusDot('static','STATIC'); }, 50);\n\n\n// \u2550\u2550\u2550 BOOT SEQUENCE \u2550\u2550\u2550\nsetTimeout(()=>{\n  document.getElementById('boot').classList.add('out');\n  document.getElementById('topbar').classList.add('in');\n  document.querySelectorAll('.panel').forEach(p=>p.classList.add('in'));\n  document.getElementById('map-ctrls').classList.add('in');\n  document.getElementById('map-zoom').classList.add('in');\n  // Auto-select highest-risk alert\n  setTimeout(()=>{const alerts=fAlerts();if(alerts.length){const bi=alerts.reduce((bi,a,i)=>a.risk_score>alerts[bi].risk_score?i:bi,0);selA(bi)}},700);\n},2600);\nsetTimeout(()=>{document.getElementById('boot').remove()},3400);\n// CROSS-REFERENCE + FUSION VIEW\nfunction dsTypeOf(id){if(id==='rf-sim')return'rf';if(id==='__fusion')return'fusion';return'ais';}\nfunction dsTypeColor(t){return t==='rf'?'#f59e0b':t==='fusion'?'#a855f7':'#60a5fa';}\n\nfunction buildXRef(obj){\n  var mmsi=String(obj.mmsi||'');\n  var edgeCase=obj._edge_case||'';\n  var matches=[];\n  Object.keys(DS).forEach(function(dsId){\n    if(dsId===S.id) return;\n    var ds=DS[dsId];var type=dsTypeOf(dsId);\n    (ds.alerts||[]).forEach(function(a){\n      if(mmsi&&String(a.mmsi)===mmsi) matches.push({dsId:dsId,dsTitle:ds.title,type:type,obj:a});\n    });\n  });\n  if(!matches.length&&!edgeCase) return '';\n  var html='<div class=\"xref-panel\">';\n  html+='<div class=\"xref-hdr\" style=\"background:#0d1f35;color:#60a5fa\">';\n  html+='<span>Cross-ref: '+matches.length+' match'+(matches.length!==1?'es':'')+' in other datasets<\\/span><\\/div>';\n  var ecDesc={\n    'AIS_DARK_RF_ACTIVE':    'AIS transponder disabled - vessel still emitting RF. Deliberate disabling.',\n    'AIS_DARK_RF_ABSENT':    'AIS gap + no RF coverage. Cannot confirm: over horizon or genuine dark.',\n    'AIS_SPOOF_CANDIDATE':   'AIS active but no RF at expected range. Possible position spoofing.',\n    'LOITERING_RF_CONFIRMED':'Loitering confirmed by RF - physical presence verified.',\n    'SENSITIVE_ZONE_RF':     'Zone entry corroborated by RF. Vessel physically present.',\n    'SPOOFING_CONFIRMED':    'Impossible AIS speed + RF position mismatch. RF is ground truth.',\n    'IUU_FISHING_DARK':      'RF-only fishing vessel. No AIS. Classic IUU dark fishing pattern.',\n    'UNREGISTERED_VESSEL':   'Unknown vessel class, RF only. No flag, no owner.',\n    'STS_TRANSFER_DARK':     'Stationary cargo-class RF. No AIS. Likely STS transfer.',\n    'DPRK_CANDIDATE':        'RF profile + routing consistent with DPRK sanctions evasion.',\n    'ILLEGAL_BUNKER_DARK':   'Tanker-class RF stationary. No AIS. Likely illegal bunkering.',\n    'TRANSHIPMENT_DARK':     'Fishing RF near transhipment corridor. Fish laundering risk.',\n    'GHOST_VESSEL':          'AIS position beyond all node horizons. Cannot verify. Satellite AIS required.',\n    'MILITARY_NO_AIS':       'Military vessel - AIS absence is standard operating procedure.',\n  };\n  if(edgeCase&&ecDesc[edgeCase]){\n    html+='<div class=\"xref-row\" style=\"cursor:default;background:#0a1628\">';\n    html+='<span style=\"font:700 8px/1 var(--mono);color:#a855f7;letter-spacing:.8px\">EDGE CASE<\\/span>';\n    html+='<span class=\"xref-ec\">'+ecDesc[edgeCase]+'<\\/span><\\/div>';\n  }\n  matches.slice(0,6).forEach(function(m){\n    var col=dsTypeColor(m.type);\n    var shortDs=m.dsTitle.replace('AMSA CTS \\u2014 ','').replace('Torres Strait Synthetic \\u2014 ','Synth ').replace('RF Fusion Sim \\u2014 ','RF ');\n    html+='<div class=\"xref-row\" onclick=\"jumpToDataset(\\''+m.dsId+'\\',\\''+m.obj.alert_id+'\\')\">'\n      +'<span class=\"xref-ds-pill\" style=\"background:'+col+'22;color:'+col+'\">'+m.type.toUpperCase()+'<\\/span>'\n      +'<span style=\"font:600 9px/1 var(--mono);color:var(--body)\">'+shortDs+'<\\/span>'\n      +'<span class=\"xref-ec\">'+(m.obj.title||m.obj.alert_type)+'<\\/span>'\n      +'<span class=\"xref-score\" style=\"color:'+col+'\">'+m.obj.risk_score+'<\\/span>'\n      +'<span style=\"font:400 9px/1 var(--mono);color:#60a5fa;margin-left:4px\">view<\\/span>'\n      +'<\\/div>';\n  });\n  html+='<\\/div>';\n  return html;\n}\n\nfunction jumpToDataset(dsId,alertId){\n  S.id=dsId;S.selA=null;S.selV=null;\n  S.FZ=buildFusion(dsId);\n  buildTabs();renderAll();\n  setTimeout(function(){var alerts=fAlerts();var idx=alerts.findIndex(function(a){return a.alert_id===alertId;});if(idx>=0)selA(idx);},100);\n}\n\nfunction renderFusion(){\n  var de=document.getElementById('de');\n  var ds_el=document.getElementById('ds');\n  if(!de||!ds_el) return;\n  de.style.display='none';\n  ds_el.style.cssText='display:flex;flex-direction:column;overflow:auto;padding:16px;flex:1';\n  var aisDs=DS['2026-05'];\n  var rfDs=DS['rf-sim'];\n  if(!aisDs||!rfDs){ds_el.innerHTML='<div style=\"color:var(--muted);padding:24px\">Missing datasets.<\\/div>';return;}\n  var aisAlertsByMmsi={};\n  (aisDs.alerts||[]).forEach(function(a){var k=String(a.mmsi);(aisAlertsByMmsi[k]=aisAlertsByMmsi[k]||[]).push(a);});\n  var rows=[];\n  (rfDs.alerts||[]).forEach(function(a){\n    var mmsi=String(a.mmsi||'');\n    var aisM=mmsi?aisAlertsByMmsi[mmsi]||[]:[];\n    var ec=a._edge_case||'';\n    var cmp;\n    if(ec==='AIS_DARK_RF_ACTIVE') cmp='DARK';\n    else if(ec==='SPOOFING_CONFIRMED'||ec==='GHOST_VESSEL') cmp='GHOST';\n    else if(ec==='AIS_DARK_RF_ABSENT') cmp='GAP';\n    else if(ec==='MILITARY_NO_AIS') cmp='EXPECTED';\n    else if(!mmsi||ec.indexOf('DARK')>=0) cmp='RF_ONLY';\n    else if(aisM.length) cmp='MATCH';\n    else cmp='RF_ONLY';\n    rows.push({a:a,aisM:aisM,cmp:cmp});\n  });\n  var ord={DARK:0,GHOST:1,RF_ONLY:2,MATCH:3,GAP:4,EXPECTED:5};\n  rows.sort(function(a,b){return(ord[a.cmp]||9)-(ord[b.cmp]||9)||(b.a.risk_score-a.a.risk_score);});\n  var meta={\n    DARK:    {col:'#f59e0b',label:'DARK',    desc:'AIS silent - RF active'},\n    GHOST:   {col:'#a855f7',label:'GHOST',   desc:'AIS contradicted by RF'},\n    RF_ONLY: {col:'#ef4444',label:'RF ONLY', desc:'No AIS correlation'},\n    MATCH:   {col:'#00e5c4',label:'MATCH',   desc:'AIS + RF agree'},\n    GAP:     {col:'#475569',label:'GAP',     desc:'Beyond sensor horizon'},\n    EXPECTED:{col:'#64748b',label:'OK',      desc:'No AIS by design'},\n  };\n  var html='';\n  html+='<div style=\"margin-bottom:14px\">';\n  html+='<div style=\"font:700 13px/1 var(--syne);color:var(--head);letter-spacing:1px;margin-bottom:4px\">AIS vs RF FUSION<\\/div>';\n  html+='<div style=\"font:400 10px/1.5 var(--mono);color:var(--muted)\">'+rows.length+' RF alerts vs '+aisDs.alerts.length+' AIS alerts. May 2026 baseline.<\\/div>';\n  html+='<\\/div>';\n  html+='<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px\">';\n  Object.keys(meta).forEach(function(k){\n    var m=meta[k];var cnt=rows.filter(function(r){return r.cmp===k;}).length;\n    if(!cnt) return;\n    html+='<div style=\"display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:3px;background:'+m.col+'18;border:1px solid '+m.col+'44\">';\n    html+='<span style=\"font:700 8px/1 var(--mono);color:'+m.col+'\">'+m.label+'<\\/span>';\n    html+='<span style=\"font:400 9px/1 var(--mono);color:var(--muted)\">'+m.desc+'<\\/span>';\n    html+='<span style=\"font:700 10px/1 var(--mono);color:'+m.col+'\">'+cnt+'<\\/span><\\/div>';\n  });\n  html+='<\\/div>';\n  html+='<div style=\"display:grid;grid-template-columns:80px 50px 100px 1fr 100px 70px;border-bottom:1px solid var(--e1);padding:0 0 6px;margin-bottom:2px\">';\n  ['STATE','SCORE','MMSI','RF ALERT','AIS MATCH','NODES'].forEach(function(h){\n    html+='<div style=\"font:600 8px/1 var(--mono);color:var(--muted);letter-spacing:.8px;padding:0 6px\">'+h+'<\\/div>';\n  });\n  html+='<\\/div>';\n  rows.forEach(function(row){\n    var a=row.a;var m=meta[row.cmp];\n    var aisText=row.aisM.length?row.aisM[0].title:'<span style=\"color:#475569\">no match<\\/span>';\n    var nodeText=(a._rf_nodes||[]).join(', ')||'none';\n    html+='<div style=\"display:grid;grid-template-columns:80px 50px 100px 1fr 100px 70px;border-bottom:1px solid var(--e1);padding:5px 0;cursor:pointer;transition:background .12s\"';\n    html+=' onclick=\"jumpFusionToAlert(\\''+a.alert_id+'\\')\"';\n    html+=' onmouseover=\"this.style.background=\\'rgba(255,255,255,.02)\\'\" onmouseout=\"this.style.background=\\'transparent\\'\">';\n    html+='<div style=\"padding:0 6px;display:flex;align-items:center\"><span style=\"font:700 8px/1 var(--mono);color:'+m.col+';background:'+m.col+'18;padding:2px 5px;border-radius:2px\">'+m.label+'<\\/span><\\/div>';\n    html+='<div style=\"font:700 10px/1 var(--mono);color:'+m.col+';padding:0 6px;display:flex;align-items:center\">'+a.risk_score+'<\\/div>';\n    html+='<div style=\"font:400 9px/1 var(--mono);color:var(--muted);padding:0 6px;display:flex;align-items:center\">'+(String(a.mmsi||a.vessel_name||'').slice(0,12))+'<\\/div>';\n    html+='<div style=\"font:400 9px/1.3 var(--mono);color:var(--body);padding:0 6px;display:flex;align-items:center\">'+(a.title||'')+'<\\/div>';\n    html+='<div style=\"font:400 8px/1.3 var(--mono);color:var(--muted);padding:0 6px;display:flex;align-items:center\">'+aisText+'<\\/div>';\n    html+='<div style=\"font:400 8px/1 var(--mono);color:#f59e0b;padding:0 6px;display:flex;align-items:center\">'+nodeText+'<\\/div>';\n    html+='<\\/div>';\n  });\n  ds_el.innerHTML=html;\n}\n\nfunction jumpFusionToAlert(alertId){\n  S.id='rf-sim';S.selA=null;S.selV=null;\n  S.FZ=buildFusion('rf-sim');\n  buildTabs();renderAll();\n  setTimeout(function(){var alerts=fAlerts();var idx=alerts.findIndex(function(a){return a.alert_id===alertId;});if(idx>=0)selA(idx);},100);\n}\n\n<\/script>\n\n\n<\/body><\/html>"
