[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boobook-mda"
version = "0.3.0"
description = "Investor-ready MVP for sovereign Australian maritime AIS/RF validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hardware = ["pyais>=2.0"]

[project.scripts]
boobook = "boobook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
